ORMAL | HIGH | 数值(-10到10) }`\n- 默认情况下所有会话为 NORMAL（0）；\n- 如果两个会话产生死锁，SQL Server 默认回滚撤销代价较小的事务；\n- 如果显式将报表任务设为 `LOW`，在死锁发生时引擎会无条件牺牲该会话回滚，从而保护核心关键 OLTP 交易事务不被中断。选 A。"}, {"id": "p3_m7", "number": 7, "title": "在 SQL Server 高可用技术中，Always On 可用性组（Availability Groups）相比于传统的数据库镜像技术，最核心的技术飞跃在于（ ）。", "options": ["A. 支持以整个可用性数据库集合为单位进行多库协同故障转移，且辅助副本可直接用于只读报表查询与备份分流", "B. 只能对单张数据表进行备份", "C. 不依赖任何网络通信", "D. 彻底废除了主副本的概念"], "answer": "A", "hint": "Always On 支持多库协同容灾，且辅助副本支持可读（只读查询分流）与备份分流", "explanation": "【官方考点与速通解析】\nAlways On 可用性组核心优势：\n1. 协同故障转移：以一组用户定义的数据库集合（可用性组）为单位整体故障转移，解决了跨库关联一致性；\n2. 资源利旧与只读分流：传统的镜像备库处于不可访问状态；Always On 的辅助副本（Secondary Replica）支持只读访问，可将大量报表查询和数据库备份分流到辅助节点，极大分担了主库压力。选 A。"}, {"id": "p3_m8", "number": 8, "title": "在 SQL Server 的三种故障恢复模型中，哪种恢复模型在执行检查点后会自动截断并不再保留不活动的事务日志，因此不支持事务日志备份，也不支持将数据库还原到特定时间点？（ ）", "options": ["A. 简单恢复模型（Simple）", "B. 完整恢复模型（Full）", "C. 大容量日志恢复模型（Bulk-Logged）", "D. 混合恢复模型"], "answer": "A", "hint": "简单恢复模型（Simple）自动清日志，无法进行日志备份，不支持时间点恢复", "explanation": "【官方考点与速通解析】\n三大恢复模型特征对比：\n- 简单恢复模型（Simple）：不维护事务日志备份链，每次检查点后自动截断并回收日志空间，占用空间小，但只能还原到最后一次完全/差异备份，不支持时点恢复；\n- 完整恢复模型（Full）：完整记录所有数据库修改日志，日志文件持续增长直到被显式备份，支持还原到任意微秒时间点（Point-in-time Restore）；\n- 大容量日志恢复模型（Bulk-Logged）：对批量导入操作进行最小日志记录，防日志撑爆。选 A。"}, {"id": "p3_m9", "number": 9, "title": "在数据仓库体系中，用于记录数据仓库自身结构、数据源映射关系、ETL 清洗规则以及业务指标定义的“关于数据的数据”被称为（ ）。", "options": ["A. 元数据（Metadata）", "B. 事实数据", "C. 维度数据", "D. 粒度数据"], "answer": "A", "hint": "关于数据的数据 = 元数据（Metadata）", "explanation": "【官方考点与速通解析】\n元数据（Metadata）是数据仓库的“神经中枢”：\n定义为“关于数据的数据”，描述数据的背景、来源、物理结构、字段含义以及转换规则。分为：\n- 技术元数据：描述存储格式、表名、索引、ETL 映射脚本与调度配置；\n- 业务元数据：描述面向业务分析师的指标口径、业务术语、数据归属人。选 A。"}, {"id": "p3_m10", "number": 10, "title": "在星型数据模型的设计中，维度表通常不直接使用业务系统的业务主键（自然键，如身份证号、工号），而是由数据仓库系统自动生成一个无实际业务含义的单调整数作为主键。这种主键被称为（ ）。", "options": ["A. 代理键（Surrogate Key）", "B. 业务主键", "C. 复合候选键", "D. 外部依赖键"], "answer": "A", "hint": "数仓维度表自增整数主键称为代理键（Surrogate Key）", "explanation": "【官方考点与速通解析】\n代理键（Surrogate Key）的设计价值：\n在数仓维度表中，强烈推荐使用由数仓自行维护的整型自增键（代理键）替代源系统的自然业务键（Natural Key）：\n1. 极佳的性能：事实表只需存储 4 字节整数作为外键，大幅减小事实表宽度与索引开销；\n2. 业务解耦与异构集成：不同业务系统的业务代码可能重名冲突，代理键实现全局统一；\n3. 完美支持 SCD 2 慢变维：同一自然人发生属性变更时，可在维度表中赋予不同的代理键生成多条历史版本行。选 A。"}, {"id": "p3_m11", "number": 11, "title": "在分布式数据库查询优化中，为了大幅降低在不同网络节点之间传输的数据量，常用的核心技术是（ ）。", "options": ["A. 半连接（Semi-Join）技术", "B. 笛卡尔积广播", "C. 强制将所有数据集中到单个节点计算", "D. 关闭所有网络压缩"], "answer": "A", "hint": "分布式查询减小网络通信的核心法宝是半连接（Semi-Join）", "explanation": "【官方考点与速通解析】\n半连接（Semi-Join，记为 R ⋉ S）优化机制：\n在分布式网络中跨节点传输整张大表网络开销极大。\n半连接的做法是：场地 1 仅将关系 R 的【连接属性列的值】提取投影并去重，将这几个字节的连接键值通过网络发送给场地 2；场地 2 用该键集与表 S 进行匹配过滤，仅把真正能成功连接的 S 元组传回场地 1。这成百上千倍地消减了网络通信数据量。选 A。"}, {"id": "p3_m12", "number": 12, "title": "在分布式系统一致性算法中，被 Kubernetes、etcd 和 Consul 广泛采用，且相较于 Paxos 更加易于工程实现和理解的分布式共识协议是（ ）。", "options": ["A. Raft 算法", "B. 快速排序算法", "C. Dijkstra 算法", "D. 冒泡排序算法"], "answer": "A", "hint": "著名易懂的分布式共识算法是 Raft 算法（Leader 选举 + 日志复制）", "explanation": "【官方考点与速通解析】\n分布式共识算法体系：\n- Paxos：图灵奖得主 Leslie Lamport 提出的经典分布式共识协议，理论严谨但极其晦涩难懂，工程落地复杂；\n- Raft：斯坦福大学团队设计的新型共识算法，将一致性问题明确解耦为 Leader 选举、日志复制（Log Replication）和安全性三个子问题，通俗易懂，成为云原生领域（etcd、TiKV）的标准共识协议。选 A。"}, {"id": "p3_m13", "number": 13, "title": "流行的高性能分布式内存数据库 Redis 提供了丰富的数据结构。其中能够支持按照“分值”（Score）对成员元素进行自动排序的数据结构是（ ）。", "options": ["A. 有序集合（Sorted Set，ZSet）", "B. 哈希（Hash）", "C. 列表（List）", "D. 字符串（String）"], "answer": "A", "hint": "带 Score 权重的自动排序结构是有序集合 ZSet（底层采用跳表 SkipList）", "explanation": "【官方考点与速通解析】\nRedis 五大基础数据类型：\n- String：字符串/二进制安全；\n- List：双向链表，支持两端推入弹出；\n- Hash：键值对散列表，适合存储对象；\n- Set：无序无重复元素集合；\n- Sorted Set（ZSet）：有序集合，每个元素关联一个浮点数分值（Score），元素按分值从小到大自动排序，底层采用跳跃表（SkipList）和哈希表实现，广泛用于实时排行榜。选 A。"}, {"id": "p3_m14", "number": 14, "title": "在图数据库（如 Neo4j）中，为了在数亿级关系网络中实现毫秒级的多度深度人脉探索，其区别于传统关系型数据库多表 JOIN 瓶颈的核心底层特性是（ ）。", "options": ["A. 无索引邻接（Index-free Adjacency）", "B. 建立更多的全表 B+ 树", "C. 依赖复杂的嵌套外键级联", "D. 单线程串行递归"], "answer": "A", "hint": "图数据库核心秘籍：无索引邻接（每个节点用指针直接挂载其相邻关系和节点）", "explanation": "【官方考点与速通解析】\n无索引邻接（Index-free Adjacency）：\n关系数据库做多度关系检索（如通过 5 层好友找人）必须进行 5 次全局索引查找和表 JOIN，时间复杂度随数据量呈爆炸增长。\n图数据库在底层直接利用物理内存指针，将每个节点与其相连的所有边（关系）物理串联在一起。遍历图时就像沿着链表指针直接跳跃，遍历耗时只与局部子图的相连边数有关，与整个图库包含的总数据量完全无关，遍历复杂度为 O(1)。选 A。"}, {"id": "p3_m15", "number": 15, "title": "在数据挖掘的关联规则发现中，Apriori 算法之所以能够极大地减少候选频繁项集的搜索空间，其依赖的核心性质是（ ）。", "options": ["A. 频繁项集的所有非空子集必定也是频繁的；反之，若某项集是非频繁的，则它的所有超集也绝不可能是频繁的", "B. 任何项集的支持度必定大于其置信度", "C. 只能挖掘包含两个商品的项集", "D. 必须先对所有交易进行聚类"], "answer": "A", "hint": "Apriori 先验性质：非频繁项集的超集必非频繁（向上剪枝）", "explanation": "【官方考点与速通解析】\nApriori 算法先验性质（Apriori Property）：\n“如果一个项集是频繁的，那么它的所有子集也必须是频繁的。”\n其逆否命题是算法剪枝的核心：如果一个候选集（例如 {A, B}）被检测出是非频繁的（低于最小支持度阈值），那么包含它的任何更大超集（如 {A, B, C}、{A, B, D} 等）都绝对不可能成为频繁项集，从而直接将整条分支剪枝，避免了指数级穷举扫描。选 A。"}, {"id": "p3_m16", "number": 16, "title": "在 T-SQL 中使用窗口函数（Window Function）对员工各部门内的工资进行排名时，若希望相同工资的员工获得相同的排名序号、且后续名次连续不产生跳跃（例如 1, 2, 2, 3），应使用的窗口排序函数是（ ）。", "options": ["A. DENSE_RANK()", "B. RANK()", "C. ROW_NUMBER()", "D. NTILE()"], "answer": "A", "hint": "DENSE_RANK() 名次连续不空跳（1,2,2,3）；RANK() 产生跳跃（1,2,2,4）；ROW_NUMBER() 纯物理序号", "explanation": "【官方考点与速通解析】\n三大四大窗口排序函数辨析：\n- `ROW_NUMBER()`：不管值是否相同，按顺序分配连续不重复的物理唯一行号（1, 2, 3, 4）；\n- `RANK()`：并列同名次，但后续名次发生跳跃留空（1, 2, 2, 4，跳过了 3）；\n- `DENSE_RANK()`：密集排名，并列同名次，但后续名次【紧密连续、不发生跳跃】（1, 2, 2, 3）；\n- `NTILE(n)`：将数据切分为 n 等份。选 A。"}, {"id": "p3_m17", "number": 17, "title": "在执行复杂的关键批量事务脚本前，网络管理员设置 `SET XACT_ABORT ON`，该设置的作用是（ ）。", "options": ["A. 当任何一条 T-SQL 语句发生运行时错误时，整个事务将自动终止并回滚", "B. 忽略所有错误继续强制向下执行", "C. 将错误记录写入 Windows 系统日志但提交事务", "D. 自动跳过触发器的检查"], "answer": "A", "hint": "XACT_ABORT ON 遇到任何执行错误自动强制回滚整个事务", "explanation": "【官方考点与速通解析】\n`SET XACT_ABORT` 开关作用：\n- 默认情况（OFF）：当某些特定运行时错误发生时，SQL Server 可能只回滚产生错误的当前单条语句，而事务后续语句可能继续执行，导致事务逻辑半生半熟；\n- 开启 `SET XACT_ABORT ON`：指示 SQL Server 一旦遇到任何运行时错误，立即强行中止整个事务并自动执行全局 ROLLBACK，保证原子性。选 A。"}, {"id": "p3_m18", "number": 18, "title": "我国《网络安全法》与等级保护 2.0 对关键信息基础设施数据库提出了“三权分立”安全管理要求。三权分立通常是指将系统的最高管理权限拆分为（ ）。", "options": ["A. 系统管理员（运维）、安全保密管理员（策略）、安全审计员（审计）", "B. 研发人员、测试人员、运维人员", "C. 数据库管理员、网络工程师、硬件工程师", "D. 董事长、总经理、财务总监"], "answer": "A", "hint": "等保三权分立：系统管理员、安全管理员、审计管理员，相互制约制衡", "explanation": "【官方考点与速通解析】\n等级保护 2.0“三权分立”原则：\n为了防范单一超级管理员（如传统 root 或 sa 拥有无限权力）滥用特权导致安全失控，标准要求设置三个独立职责角色相互监督制衡：\n1. 系统管理员：负责系统日常运行维护、配置部署、备份恢复，但无权查看审计日志；\n2. 安全保密管理员：负责安全策略制定、用户账号与角色权限划分授权；\n3. 安全审计员：负责独立审查所有人员的操作行为日志、分析异常违规事件，但无权修改系统配置和业务数据。选 A。"}, {"id": "p3_m19", "number": 19, "title": "防范 Web 应用向后端数据库发起 SQL 注入（SQL Injection）攻击的最有效、根本性的防范技术是（ ）。", "options": ["A. 采用参数化查询（Parameterized Query）或强类型存储过程调用", "B. 单纯依赖在前端 JavaScript 中过滤单引号", "C. 将数据库默认端口 1433 修改为任意其他端口", "D. 提高数据库服务器的 CPU 主频"], "answer": "A", "hint": "防 SQL 注入正统治本之道：使用参数化查询（Prepared Statement）", "explanation": "【官方考点与速通解析】\nSQL 注入防御核心原则：\nSQL 注入的根源在于“将未经校验的用户输入作为代码的一部分拼接到 SQL 语句中编译执行”。\n参数化查询（预编译语句）在数据库引擎底层将代码与数据严格分离：SQL 语句的语法骨架首先被预先编译，用户输入的内容仅仅作为纯粹的数据参数绑定传入，无论输入包含何种单引号、`OR 1=1` 或 `--` 注释符，数据库均将其视为纯字面常量处理，从根本上杜绝代码注入。选 A。"}, {"id": "p3_m20", "number": 20, "title": "在 SQL Server 中，针对海量数据分析（OLAP）场景，列存储索引（Columnstore Index）相比传统行存储索引在查询性能上能够获得数倍至数十倍提升，其核心机制是（ ）。", "options": ["A. 数据按列垂直组织存放并采用高比率压缩，且支持基于批处理模式（Batch Mode）矢量化执行", "B. 将所有数据无损转换为 XML 格式存储", "C. 彻底关闭了磁盘 I/O 检查", "D. 只允许保存数值型数据"], "answer": "A", "hint": "列存储索引：按列存储超高压缩比，结合 Batch Mode 批处理指令加速", "explanation": "【官方考点与速通解析】\n列存储索引（Columnstore Index）突破性技术：\n1. 数据按列物理组织：同一列的数据类型相同，具有极高的数据相似度，压缩率通常高达 5~10 倍；\n2. 极度节省 I/O：分析聚合某几个列时（如计算总销售额），只需读取该列所在的数据块，完全无需扫描其他无关列；\n3. 批处理模式（Batch Mode）：CPU 一次性处理一个包含约 900 行的数据包，大幅提升指令级并行度与 CPU 缓存命中率。选 A。"}, {"id": "p3_m21", "number": 21, "title": "在关系代数表达式中，将多个连续的投影运算或选择运算进行合并串接。若关系代数包含 $\\sigma_{C1}(\\sigma_{C2}(R))$，其等价变换为（ ）。", "options": ["A. $\\sigma_{C1 \\land C2}(R)$", "B. $\\sigma_{C1 \\lor C2}(R)$", "C. $\\sigma_{C1}(R) \\cup \\sigma_{C2}(R)$", "D. $\\sigma_{C1}(R) \\cap \\sigma_{C2}(R)$"], "answer": "A", "hint": "连续两次选择过滤相当于两条件的逻辑与（AND / ∧）", "explanation": "【官方考点与速通解析】\n关系代数等价变换规则之选择串接律：\n选择操作是对元组的条件筛选。先按照条件 C2 筛选出子集，再在结果中按条件 C1 筛选，其最终结果显然等于同时满足条件 C1 和条件 C2 的元组集合，即 $\\sigma_{C1 \\land C2}(R)$。选 A。"}, {"id": "p3_m22", "number": 22, "title": "在 SQL Server 中，用户定义标量函数（Scalar Function）与内联表值函数（Inline Table-Valued Function）的关键区别在于（ ）。", "options": ["A. 标量函数返回单一的标量数据值，而内联表值函数返回一个结果表格", "B. 标量函数不能带任何参数", "C. 内联表值函数必须包含 BEGIN ... END 语句块", "D. 标量函数只能在系统 master 数据库中创建"], "answer": "A", "hint": "标量函数返回单值（如 INT/VARCHAR），表值函数返回一张 TABLE", "explanation": "【官方考点与速通解析】\n用户定义函数分类：\n- 标量函数（Scalar UDF）：返回单个标量数据值（如返回计算出的折扣额、格式化字符串），在 SELECT 列表中逐行调用；\n- 内联表值函数（Inline TVF）：返回一个 `TABLE` 类型，函数体只有一个单一的 RETURN (SELECT ...) 语句，没有 BEGIN/END，优化器将其像普通视图一样展开优化；\n- 多语句表值函数：包含 BEGIN/END，在内部构建表变量并返回。选 A。"}, {"id": "p3_m23", "number": 23, "title": "在数据库设计中，为了兼顾高频统计查询的极速响应，适度违背范式规则、在关系模式中引入少量冗余字段（如在订单表直接存储订单总金额）的做法属于（ ）。", "options": ["A. 数据库反规范化（Denormalization）技术", "B. 数据库第二范式破坏错误", "C. 存储过程设计失误", "D. 索引失效"], "answer": "A", "hint": "适度牺牲范式、增加冗余以减少高频跨表 JOIN = 反规范化（Denormalization）", "explanation": "【官方考点与速通解析】\n反规范化（Denormalization）工程折中：\n规范化（范式化）减少了数据冗余、消除了插入/修改异常，但在高并发查询时往往需要执行昂贵的跨表多路连接（JOIN）。\n反规范化技术在满足特定高并发分析需求的前提下，通过有意增加适度的数据冗余（如增加冗余列、增加派生汇总列、表合并），以磁盘空间换取查询性能，是物理数据库优化的常用手段。选 A。"}, {"id": "p3_m24", "number": 24, "title": "在分布式数据库系统架构中，“局部映射透明性”（Local Mapping Transparency）位于三级分布透明性中的（ ）。", "options": ["A. 最底层（最低级别透明性）", "B. 最高层（最高级别透明性）", "C. 中间层", "D. 与分片透明性同级"], "answer": "A", "hint": "透明性高低顺序：分片透明（最高） > 位置透明（中间） > 局部映射透明（最低）", "explanation": "【官方考点与速通解析】\n分布透明性层次结构：\n1. 分片透明性（最高层）：用户连数据分片存在都不知道；\n2. 位置透明性（中间层）：用户知道分片，但不知道分片保存在哪个具体物理站点；\n3. 局部映射透明性（最低层）：用户不仅知道分片，还知道分片在哪个站点，但无需知道该站点内部的具体物理数据模型和本地存储细节。选 A。"}, {"id": "p3_m25", "number": 25, "title": "在空间数据库（Spatial Database）中，用于表示地图地理坐标、经纬度及地球曲面几何计算的数据类型是（ ）。", "options": ["A. Geography 数据类型", "B. Geometry 数据类型", "C. Varchar(MAX)", "D. Image 数据类型"], "answer": "A", "hint": "Geography 表示椭球体地理坐标（经纬度）；Geometry 表示平面欧氏几何空间", "explanation": "【官方考点与速通解析】\n空间数据类型：\n- `geography`：用于存储圆球面（椭球体）地面数据，使用 GPS 经纬度坐标，计算距离时自动考虑地球曲率；\n- `geometry`：用于存储平面（平坦直角坐标系）欧几里得几何数据，按平面欧氏几何公式计算距离。选 A。"}, {"id": "p3_m26", "number": 26, "title": "在 SQL Server 中，DBA 运行 DBCC SHRINKFILE 命令的主要目的通常是（ ）。", "options": ["A. 收缩指定数据文件或日志文件的物理磁盘分配空间，将多余的未用空间释放回操作系统", "B. 扩展磁盘文件的最大上限容量", "C. 加密日志文件", "D. 重置系统表中的所有自增标识值"], "answer": "A", "hint": "SHRINK 即收缩，收缩文件释放空闲磁盘空间", "explanation": "【官方考点与速通解析】\n`DBCC SHRINKFILE(file_name, target_size)` 语法：\n用于收缩当前数据库的指定数据文件或事务日志文件，将指定文件内部未被使用的物理磁盘扇区空间释放归还给底层操作系统，常用于清理暴涨之后的庞大日志文件。选 A。"}, {"id": "p3_m27", "number": 27, "title": "在数据仓库星型模型中，事实表（Fact Table）的主键通常由（ ）构成。", "options": ["A. 引用各个维度表的外键组合而成的复合主键", "B. 单一的自增员工工号", "C. 任意一个维度的自然代码", "D. 时间维度的字符串"], "answer": "A", "hint": "事实表主键是由所有外围维度表的外键（代理键）组合而成的复合主键", "explanation": "【官方考点与速通解析】\n事实表（Fact Table）结构特性：\n事实表由两大部分构成：\n1. 维度键：指向各个维度表的外键（如时间维外键、客户维外键、产品维外键），这些外键组合起来构成了事实表的【复合主键】；\n2. 事实度量值：包含可加或半可加的数值指标（如销售量、销售金额、利润率）。选 A。"}, {"id": "p3_m28", "number": 28, "title": "SQL Server 查询优化器在决定使用“索引查找”（Index Seek）还是“表扫描”（Table Scan）时，所依赖的最关键统计元数据是（ ）。", "options": ["A. 数据表的统计信息（Statistics，包含直方图和密度向量）", "B. 操作系统的版本号", "C. 客户端网卡的连接速度", "D. 数据库管理员的登录名"], "answer": "A", "hint": "优化器基数估算的核心依据是统计信息（Statistics）与直方图", "explanation": "【官方考点与速通解析】\n统计信息（Statistics）是基于成本优化器（CBO）的基石：\nSQL Server 在索引列和查询条件列上自动或手动生成统计信息，内含采样数据构建的【直方图（Histogram）】和选择性密度。优化器通过直方图精确估算符合条件的行数（基数估算），行数极少时选索引查找（Seek），行数很大时选全表扫描（Scan）。若统计信息过旧，会导致优化器误判。选 A。"}, {"id": "p3_m29", "number": 29, "title": "在 SQL Server 中，用于在单一原子语句中同时支持“若存在则更新，若不存在则插入”（即著名的 Upsert 模式）的现代标准 SQL 语句是（ ）。", "options": ["A. MERGE 语句", "B. UPSERT 语句", "C. COMBINE 语句", "D. SYNC 语句"], "answer": "A", "hint": "标准 SQL 中整合 INSERT 与 UPDATE 的强大语句是 MERGE", "explanation": "【官方考点与速通解析】\n`MERGE` 语句（SQL:2008 标准，SQL Server 2008 引入）：\n语法结构：`MERGE TargetTable USING SourceTable ON 条件 WHEN MATCHED THEN UPDATE ... WHEN NOT MATCHED THEN INSERT ...;`\n一条语句同时完成对目标表的匹配更新和不匹配插入，且作为单个原子操作执行，极大提升了 ETL 数据同步效率。选 A。"}, {"id": "p3_m30", "number": 30, "title": "在数据库概念建模方法中，IDEF1X 方法是一种广泛应用于国防和工业界的结构化建模标准。在 IDEF1X 中，用于表示实体间“确定性联系”（Identifying Relationship）的图形线是（ ）。", "options": ["A. 实线", "B. 虚线", "C. 双虚线", "D. 带有波浪符号的线"], "answer": "A", "hint": "IDEF1X 中实线表示确定联系（标识联系），虚线表示非确定联系", "explanation": "【官方考点与速通解析】\nIDEF1X 建模图符规则：\n- 确定联系（Identifying Relationship，标识联系）：子实体的存在完全依赖于父实体的主码（父实体主码成为子实体主码的一部分），在 IDEF1X 中用【实线】连接；\n- 非确定联系（Non-identifying Relationship）：父实体的主码仅成为子实体的外键属性（普通属性），用【虚线】连接。选 A。"}, {"id": "p3_m31", "number": 31, "title": "在关系数据库逻辑设计中，若属性组 K 能够唯一标识关系模式 R 中的元组，但 K 的任何真子集都无法唯一标识元组，则 K 被称为（ ）。", "options": ["A. 候选码（Candidate Key）", "B. 超码（Super Key）", "C. 外码（Foreign Key）", "D. 代理键（Surrogate Key）"], "answer": "A", "hint": "唯一标识且不含多余属性（极小性）= 候选码", "explanation": "【官方考点与速通解析】\n超码 vs 候选码：\n- 超码（Super Key）：只要能够唯一标识元组的属性集（可以包含冗余无用的属性）；\n- 候选码（Candidate Key）：能够唯一标识元组，且【不含任何多余属性】的极小超码（Minimal Superkey）。选 A。"}, {"id": "p3_m32", "number": 32, "title": "在数据库恢复技术中，关于“静态转储”（Cold Backup）与“动态转储”（Hot Backup）的区别，正确的是（ ）。", "options": ["A. 动态转储在转储期间允许用户正常对数据库进行并发事务操作", "B. 静态转储运行效率远高于动态转储，且完全不需要停机", "C. 动态转储得到的数据副本必定处于完全一致的静止状态", "D. 静态转储必须结合运行期间的事务日志才能完成恢复"], "answer": "A", "hint": "动态转储在线不停机；静态转储必须无事务运行（脱机）", "explanation": "【官方考点与速通解析】\n转储状态对比：\n- 静态转储（冷备份）：在没有运行任何并发事务的状态下进行转储，必须暂停系统运行，转储出的副本是一致的；\n- 动态转储（热备份）：转储期间允许用户正常执行读写事务，无需停机。但转储期间发生的数据更新可能导致备份副本中数据不一致，因此动态转储【必须同时记录转储期间的事务日志】，恢复时利用日志消除不一致性。选 A。"}, {"id": "p3_m33", "number": 33, "title": "在联机分析处理（OLAP）系统的四种物理存储架构中，将多维数据直接存储在专用的多维数据库（MDBMS）阵列结构中的架构是（ ）。", "options": ["A. MOLAP（多维 OLAP）", "B. ROLAP（关系 OLAP）", "C. HOLAP（混合 OLAP）", "D. WOLAP（网络 OLAP）"], "answer": "A", "hint": "直接用专有多维数组存储的是 MOLAP", "explanation": "【官方考点与速通解析】\nOLAP 物理架构分类：\n- MOLAP（Multidimensional OLAP）：采用物理多维数组存储多维数据立方体，查询预计算度量速度最快，但数据加载慢且稀疏度高；\n- ROLAP（Relational OLAP）：利用传统关系数据库（星型/雪花模型）模拟存储多维数据，扩展性好，但分析查询需大量 JOIN；\n- HOLAP（Hybrid OLAP）：混合架构，核心汇总数据存 MOLAP，底层明细数据存 ROLAP。选 A。"}, {"id": "p3_m34", "number": 34, "title": "关系模式规范化要求消除数据依赖带来的异常。这些异常不包括（ ）。", "options": ["A. 物理存储损坏异常", "B. 数据插入异常", "C. 数据删除异常", "D. 数据修改异常与冗余"], "answer": "A", "hint": "规范化解决的是由于逻辑设计不良导致的插入异常、删除异常和修改冗余，物理介质损坏属于硬件故障", "explanation": "【官方考点与速通解析】\n不规范模式（如 1NF）带来的三大经典逻辑异常：\n1. 插入异常：本应存入的数据由于主键某些字段为空而无法插入；\n2. 删除异常：删除某些无关数据时，导致重要业务数据被意外附带删除；\n3. 修改异常（更新异常）与庞大冗余：修改一个实体信息需要并发修改数百行，极易产生数据不一致。\n物理存储损坏属于硬件故障，与范式规范化无关。选 A。"}, {"id": "p3_m35", "number": 35, "title": "在 SQL 授权语句中，GRANT SELECT, UPDATE ON Employee TO User1; 执行后，User1 用户获得了（ ）。", "options": ["A. 对 Employee 表的查询和修改权限", "B. 对 Employee 表的所有完全控制权限", "C. 连同将这些权限转授给第三方的权利", "D. 删除 Employee 表结构的权利"], "answer": "A", "hint": "GRANT SELECT, UPDATE 仅授予查询和更新权限", "explanation": "【官方考点与速通解析】\n标准 SQL 授权分析：\n`GRANT SELECT, UPDATE ON Employee TO User1;` 明确指定了只授予 `SELECT`（读取查询）和 `UPDATE`（数据修改）两项权限；因为没有附加 `WITH GRANT OPTION`，User1 不能将这些权限转授他人；删除表结构需要 DROP 权限。故选 A。"}, {"id": "p3_m36", "number": 36, "title": "在分布式数据库的“两阶段封锁”（Distributed 2PL）协议中，为了在全网防止死锁，可以为每个事务分配唯一的全局时间戳。根据时间戳决定优先级的“等待-死亡”（Wait-Die）非抢占策略规则是（ ）。", "options": ["A. 老事务（时间戳小）申请新事务持有的锁时允许等待；新事务（时间戳大）申请老事务的锁时立即死亡（自杀回滚）", "B. 只要冲突就全部回滚", "C. 新事务强行抢占老事务的锁", "D. 无论何时均无限期等待"], "answer": "A", "hint": "Wait-Die（等待-死亡）策略：老事务等，新事务死（自杀）", "explanation": "【官方考点与速通解析】\n死锁预防两大著名时间戳策略（TS 越小代表事务资历越老）：\n1. Wait-Die（非抢占式）：若 Ti 申请被 Tj 持有的锁：\n   - 如果 Ti 比 Tj 老（TS(Ti) < TS(Tj)），系统允许 Ti 等待（Wait）；\n   - 如果 Ti 比 Tj 年轻（TS(Ti) > TS(Tj)），系统直接强行将 Ti 杀死回滚（Die）；\n2. Wound-Wait（抢占式）：老事务直接伤害剥夺新事务的锁（Wound），新事务则等待老事务。选 A。"}, {"id": "p3_m37", "number": 37, "title": "在 SQL Server 中，若希望在插入数据时由系统自动为某一整数列依次生成连续递增的唯一序号，通常在定义列时添加的属性是（ ）。", "options": ["A. IDENTITY(种子, 增量)", "B. AUTO_INCREMENT", "C. SEQUENCE_ROW", "D. UNIQUE_KEY"], "answer": "A", "hint": "SQL Server 自增列属性是 IDENTITY(seed, increment)", "explanation": "【官方考点与速通解析】\nSQL Server 自增列语法为 `IDENTITY(1, 1)`（起始种子为 1，每次自增 1）。\n注：`AUTO_INCREMENT` 是 MySQL 的语法，在 SQL Server 中使用 IDENTITY。选 A。"}, {"id": "p3_m38", "number": 38, "title": "在分布式数据库中，当各节点之间的网络通信完全中断划分为两个孤立网络分区时，若两边的节点仍各自独立接收写入并提交事务，最可能导致的数据灾难被称为（ ）。", "options": ["A. 脑裂（Split-Brain）导致数据严重冲突不可逆", "B. 内存永久锁定", "C. 操作系统蓝屏", "D. CPU 频率归零"], "answer": "A", "hint": "网络分区双活导致集群精神分裂 = 脑裂（Split-Brain）", "explanation": "【官方考点与速通解析】\n脑裂（Split-Brain）故障：\n在双中心或集群系统中，如果心跳通信链路发生物理中断，但两侧节点本身全部存活。若缺乏仲裁机制，两侧都误以为对方已宕机，纷纷在本地将自己推举为主节点（Master），并发对外提供写服务。这将导致两边产生完全不同的写入数据，一旦网络恢复，数据状态发生毁灭性冲突且无法自动合并，这种灾难被称为“脑裂”。选 A。"}, {"id": "p3_m39", "number": 39, "title": "在关系数据理论中，设有关系模式 R(A, B, C, D) 和函数依赖集 F = {A -> B, B -> C, D -> A}。该关系模式的候选码是（ ）。", "options": ["A. D", "B. A", "C. (A, D)", "D. (B, D)"], "answer": "A", "hint": "计算闭包：D+ = {D, A, B, C}，能够决定全部属性，因此 D 是唯一的候选码", "explanation": "【官方考点与速通解析】\n闭包推导法求解候选码：\n1. 考察属性位置：D 在依赖右边从未出现过，因此 D 必定包含在任何候选码中；\n2. 计算 D 的属性闭包 D+：\n   - 由 D -> A 可推导 {D, A}；\n   - 由 A -> B 可推导 {D, A, B}；\n   - 由 B -> C 可推导 {D, A, B, C} 全部 4 个属性！\n3. 因此 D 单个属性即能决定关系中所有属性，且不存在更小子集，关系模式 R 的候选码就是 D。选 A。"}, {"id": "p3_m40", "number": 40, "title": "在数据挖掘中，利用 K-Means 算法对客户群体进行消费画像分群时，K-Means 属于（ ）。", "options": ["A. 无监督学习聚类算法（无需预先提供已知标签的训练样本）", "B. 有监督学习分类算法", "C. 时间序列预测模型", "D. 关联规则频繁模式算法"], "answer": "A", "hint": "K-Means 是典型的无监督聚类算法（无需人工标注标签）", "explanation": "【官方考点与速通解析】\n机器学习任务分类：\n- 无监督学习（Unsupervised Learning）：训练数据只有特征，没有人工预先标注的标签（Label）。K-Means（K均值）聚类算法根据样本间的距离相似度自动将样本划分为 K 个簇，是无监督学习的代表；\n- 有监督学习（Supervised Learning）：输入数据带有明确的目标输出标签（如决策树、朴素贝叶斯、支持向量机）。选 A。"}], "blanks": [{"id": "p3_b1", "number": 1, "score": 2, "prompt": "【空 1】在 SQL Server 物理存储结构中，由 8 个在物理上连续的数据页组成的空间管理单位称为【 1 】（Extent）。", "placeholder": "例如: 区 或 扩展区", "answer": ["区", "扩展区", "盘区", "Extent"], "hint": "8个连续数据页组成一个区（Extent）"}, {"id": "p3_b2", "number": 2, "score": 2, "prompt": "【空 2】在创建索引时，为了减少由于数据插入导致的页拆分，用于指定叶级数据页预留空闲百分比的参数是【 2 】（Fill Factor）。", "placeholder": "例如: 填充因子", "answer": ["填充因子", "FILLFACTOR", "fillfactor"], "hint": "预留页面百分比参数为填充因子"}, {"id": "p3_b3", "number": 3, "score": 2, "prompt": "【空 3】在 SQL Server 触发器中，专门用于检测某特定属性列是否被 INSERT 或 UPDATE 语句修改的内置函数是【 3 】(列名)。", "placeholder": "例如: UPDATE", "answer": ["UPDATE", "update"], "hint": "检测列是否变动使用 UPDATE() 函数"}, {"id": "p3_b4", "number": 4, "score": 2, "prompt": "【空 4】在 SQL Server 中，只有在【 4 】恢复模型下，系统才记录完整修改日志，并支持将数据库还原到任意指定的微秒时间点。", "placeholder": "例如: 完整", "answer": ["完整", "完整恢复模型", "Full", "FULL"], "hint": "支持时点恢复的是完整恢复模型（Full）"}, {"id": "p3_b5", "number": 5, "score": 2, "prompt": "【空 5】在数据仓库体系中，以事实表为核心、并且其周围的各个维度表进行了进一步范式规范化拆解的多维架构称为【 5 】模型。", "placeholder": "例如: 雪花", "answer": ["雪花", "雪花模型", "Snowflake Schema"], "hint": "维度表规范化拆分后形似雪花"}, {"id": "p3_b6", "number": 6, "score": 2, "prompt": "【空 6】分布式系统 CAP 定理中的三个字母分别代表强一致性（Consistency）、可用性（Availability）和【 6 】容忍性（Partition tolerance）。", "placeholder": "例如: 分区", "answer": ["分区", "网络分区"], "hint": "P 代表分区容忍性（Partition tolerance）"}, {"id": "p3_b7", "number": 7, "score": 2, "prompt": "【空 7】Redis 数据库中能够通过跳跃表（SkipList）实现元素按照分值（Score）自动排序的集合数据结构是【 7 】（Sorted Set）。", "placeholder": "例如: 有序集合 或 ZSet", "answer": ["有序集合", "ZSet", "zset", "Sorted Set"], "hint": "带分值自动排序的是有序集合 ZSet"}, {"id": "p3_b8", "number": 8, "score": 2, "prompt": "【空 8】在关系规范化中，如果一个关系模式消除了非主属性对候选码的传递函数依赖，则该模式至少达到第【 8 】范式。", "placeholder": "填 三 或 3 或 3NF", "answer": ["三", "3", "3NF", "第三范式"], "hint": "消除传递依赖达到 3NF"}, {"id": "p3_b9", "number": 9, "score": 2, "prompt": "【空 9】在 T-SQL 中，使用【 9 】语句可以实现单条原子操作完成“匹配时更新、不匹配时插入”的数据同步功能。", "placeholder": "例如: MERGE", "answer": ["MERGE", "merge"], "hint": "集成插入与更新的语句是 MERGE"}, {"id": "p3_b10", "number": 10, "score": 2, "prompt": "【空 10】在多维数据分析（OLAP）中，将多维立方体中的坐标轴行列互换、转换查看视角的操作称为【 10 】（Pivot）。", "placeholder": "例如: 旋转", "answer": ["旋转", "Pivot", "透视"], "hint": "行列轴互换为旋转操作（Pivot）"}, {"id": "p3_b11", "number": 11, "score": 2, "prompt": "【空 11】在 T-SQL 窗口函数中，生成相同值并列相同名次且后续排名不留空跳跃的函数是【 11 】()。", "placeholder": "例如: DENSE_RANK", "answer": ["DENSE_RANK", "dense_rank"], "hint": "连续名次无空跳为 DENSE_RANK()"}, {"id": "p3_b12", "number": 12, "score": 2, "prompt": "【空 12】在基于日志的故障恢复中，对于在故障发生前已提交的事务需要执行 REDO，而对于未提交的异常事务需要执行【 12 】（撤销）。", "placeholder": "例如: UNDO", "answer": ["UNDO", "undo", "撤销"], "hint": "撤销未提交事务使用 UNDO"}, {"id": "p3_b13", "number": 13, "score": 2, "prompt": "【空 13】在数据仓库维度表中，由数仓系统自动生成的没有任何实际业务含义的整数主键称为【 13 】键（Surrogate Key）。", "placeholder": "例如: 代理", "answer": ["代理", "代理键", "Surrogate Key"], "hint": "数仓整型主键称为代理键"}, {"id": "p3_b14", "number": 14, "score": 2, "prompt": "【空 14】在分布式数据库两阶段提交协议（2PC）中，包含协调者向各节点询问的第一阶段和各节点正式执行的第二阶段，其中第一阶段称为【 14 】阶段（Prepare）。", "placeholder": "例如: 准备 或 表决", "answer": ["准备", "表决", "准备阶段", "表决阶段"], "hint": "第一阶段为准备（表决）阶段，第二阶段为提交阶段"}, {"id": "p3_b15", "number": 15, "score": 2, "prompt": "【空 15】数据库安全等级保护 2.0 要求打破单一超级管理员权力，推行系统管理员、安全保密管理员和【 15 】管理员的三权分立制度。", "placeholder": "例如: 审计 或 安全审计", "answer": ["审计", "安全审计", "安全审计员", "审计员"], "hint": "三权分立：系统管理员、安全保密员、安全审计员"}], "applied_questions": [{"id": "p3_app1", "number": 1, "score": 15, "title": "设计与应用题一：数据仓库星型模型构建与模式设计（15分）", "description": "某跨国零售连锁集团拟构建企业销售分析数据仓库系统。通过对业务需求的梳理，确定其业务分析的核心主题是“商品零售销售”。分析师需要从以下三个主要维度切入考察销售表现：\n1. 时间维度（Time）：包含时间代理键（TimeKey）、完整日期（FullDate）、年份（YearNumber）、季度（QuarterNumber）、月份（MonthNumber）；\n2. 门店维度（Store）：包含门店代理键（StoreKey）、门店编号（StoreCode）、门店名称（StoreName）、所在城市（City）、所在省份（Province）；\n3. 商品维度（Product）：包含商品代理键（ProductKey）、商品编码（ProductCode）、商品名称（ProductName）、商品大类（Category）、单价（UnitPrice）。\n\n核心度量事实：在每次销售交易中，需要度量销售数量（SalesQty）和实际销售总金额（SalesAmount）。\n\n请按照数据仓库星型模型规范，回答下列各小题：", "subquestions": [{"id": "p3_app1_1", "score": 5, "prompt": "【小题 1】请设计并写出居于多维模型中心的“销售事实表”（Fact_Sales）的关系模式定义（格式：表名(属性1, 属性2...)，并标明哪些字段构成复合主键，哪些是度量值）：", "placeholder": "例如: Fact_Sales(TimeKey, StoreKey, ProductKey, SalesQty, SalesAmount)", "answer": ["Fact_Sales(TimeKey, StoreKey, ProductKey, SalesQty, SalesAmount)", "Fact_Sales(TimeKey, StoreKey, ProductKey, SalesQty, SalesAmount, OrderID)", "销售事实表(TimeKey, StoreKey, ProductKey, SalesQty, SalesAmount)"], "hint": "事实表由三个维度代理外键（TimeKey, StoreKey, ProductKey）与两个度量指标（SalesQty, SalesAmount）组成"}, {"id": "p3_app1_2", "score": 4, "prompt": "【小题 2】指出该星型模型中各个维度表推荐采用的主键类型（填 自然业务键 或 代理键），并简要说明采用该主键类型的两个核心技术理由：", "placeholder": "例如: 代理键; 理由: 1.整型体积小提升JOIN性能; 2.支持慢变维保留历史", "answer": ["代理键", "代理键（Surrogate Key）", "代理主键"], "hint": "数仓维度表主键采用代理键（Surrogate Key，整型自增），提升性能并支持慢变维"}, {"id": "p3_app1_3", "score": 6, "prompt": "【小题 3】请编写 SQL 统计分析语句：统计“2024年”在“北京市”各“商品大类（Category）”的总销售额，按总销售额从大到小降序排列：", "placeholder": "SELECT p.Category, SUM(f.SalesAmount) ... GROUP BY p.Category ORDER BY ...", "answer": ["SELECT p.Category, SUM(f.SalesAmount) AS TotalSales FROM Fact_Sales f JOIN Dim_Time t ON f.TimeKey = t.TimeKey JOIN Dim_Store s ON f.StoreKey = s.StoreKey JOIN Dim_Product p ON f.ProductKey = p.ProductKey WHERE t.YearNumber = 2024 AND s.City = '北京市' GROUP BY p.Category ORDER BY TotalSales DESC"], "hint": "事实表关联时间、门店和商品三个维度表，WHERE 过滤 2024 年和北京市，GROUP BY Category，ORDER BY 降序"}], "explanation": "【官方考点与标准解答】\n1. 销售事实表结构设计：\n   - 关系模式：`Fact_Sales(TimeKey, StoreKey, ProductKey, SalesQty, SalesAmount)`；\n   - 键与度量分析：\n     * 外键组合：`TimeKey`（参照时间维）、`StoreKey`（参照门店维）、`ProductKey`（参照商品维）。三者联合构成事实表的复合主键；\n     * 业务度量值：`SalesQty`（销量）、`SalesAmount`（总金额），均为完全可加性事实数值。\n2. 代理键优势：\n   - 推荐使用【代理键（Surrogate Key）】；\n   - 核心技术理由：\n     1. 性能极大提升：代理键是紧凑的单调整型（INT），在事实表中仅占 4 字节，大幅降低庞大事实表的存储体积和连接（JOIN）开销；\n     2. 支持慢变维（SCD 2）：当商品类别或门店信息变更时，可通过新增代理键记录完整跟踪历史属性版本；\n     3. 屏蔽源系统业务变更：解耦异构数据源的代码冲突。\n3. 多维分析查询 SQL：\n```sql\nSELECT \n    p.Category,\n    SUM(f.SalesAmount) AS TotalSales\nFROM Fact_Sales f\nJOIN Dim_Time t ON f.TimeKey = t.TimeKey\nJOIN Dim_Store s ON f.StoreKey = s.StoreKey\nJOIN Dim_Product p ON f.ProductKey = p.ProductKey\nWHERE t.YearNumber = 2024 AND s.City = '北京市'\nGROUP BY p.Category\nORDER BY TotalSales DESC;\n```"}, {"id": "p3_app2", "number": 2, "score": 15, "title": "设计与应用题二：多表连接视图与 INSTEAD OF 触发器数据插入编程（15分）", "description": "某人力资源系统中包含两个基表：\n1. 部门表 `Department`：包含部门编号 `DeptID`（主键，char(5)）、部门名称 `DeptName`（varchar(30)）；\n2. 员工表 `Employee`：包含员工工号 `EmpID`（主键，char(8)）、员工姓名 `EmpName`（varchar(20)）、部门编号 `DeptID`（外键，char(5)）、基本工资 `Salary`（decimal(10,2)）。\n\n管理员创建了一个多表连接视图 `V_EmpDept`：\n```sql\nCREATE VIEW V_EmpDept AS\nSELECT e.EmpID, e.EmpName, e.Salary, d.DeptID, d.DeptName\nFROM Employee e JOIN Department d ON e.DeptID = d.DeptID;\n```\n\n【业务更新要求】\n默认情况下，向视图 `V_EmpDept` 直接 INSERT 会引发报错。请在视图 `V_EmpDept` 上创建一个 `INSTEAD OF INSERT` 触发器 `trig_InsertV_EmpDept`。当向视图插入一行新数据时：\n1. 首先检查插入的部门编号 `DeptID` 是否已经在 `Department` 表中存在；\n2. 如果该部门尚不存在，则首先自动向 `Department` 表插入该新部门记录（`DeptID` 和 `DeptName`）；\n3. 随后向 `Employee` 表插入员工记录（`EmpID`, `EmpName`, `Salary`, `DeptID`）。\n\n请阅读并补全下列触发器定义代码：", "code_snippet": "CREATE TRIGGER trig_InsertV_EmpDept\nON V_EmpDept\nINSTEAD OF 【空 1】\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @eid CHAR(8), @ename VARCHAR(20), @sal DECIMAL(10,2);\n    DECLARE @did CHAR(5), @dname VARCHAR(30);\n    \n    -- 从 inserted 临时表中读取待插入的数据\n    SELECT @eid = EmpID, @ename = EmpName, @sal = Salary, \n           @did = DeptID, @dname = DeptName \n    FROM 【空 2】;\n    \n    -- 检查部门是否存在\n    IF NOT EXISTS (SELECT 1 FROM Department WHERE DeptID = @did)\n    BEGIN\n        -- 插入新部门\n        INSERT INTO Department(DeptID, DeptName)\n        VALUES (@did, @dname);\n    END\n    \n    -- 向员工表插入新员工\n    INSERT INTO Employee(EmpID, EmpName, Salary, DeptID)\n    VALUES (@eid, @ename, @sal, 【空 3】);\nEND", "subquestions": [{"id": "p3_app2_1", "score": 5, "prompt": "【空 1】指定该 INSTEAD OF 触发器拦截的 DML 事件（填 INSERT / UPDATE / DELETE）：", "placeholder": "填 INSERT", "answer": ["INSERT", "insert"], "hint": "向视图插入数据，填 INSERT"}, {"id": "p3_app2_2", "score": 5, "prompt": "【空 2】读取待插入新记录的系统内置虚拟临时表名称：", "placeholder": "例如: inserted", "answer": ["inserted", "INSERTED"], "hint": "新数据存放在 inserted 表中"}, {"id": "p3_app2_3", "score": 5, "prompt": "【空 3】插入 Employee 表 VALUES 子句中对应部门外键变量名称：", "placeholder": "例如: @did", "answer": ["@did", "@did;"], "hint": "对应变量 @did"}], "explanation": "【官方考点与代码解析】\n1. 空 1：题干要求“当向视图插入一行新数据时”，说明该触发器用于拦截针对视图的插入操作，因此定义为 `INSTEAD OF INSERT`。\n2. 空 2：在触发器激活时，客户端发送的待插入记录被暂存在虚拟内存表 `inserted` 中，故写 `FROM inserted`。\n3. 空 3：向底层员工基表插入记录时，外键部门编号对应前面提取的变量 `@did`。\n4. 核心原理：通过在视图上定义 INSTEAD OF 触发器，系统拦截了用户对复杂连接视图的直接写请求，由触发器代码自主保证了主从表的插入次序（先建主表部门，再建子表员工），完美解决了复杂多表连接视图不可直接插入数据的业界技术痛点。"}]}];

    let currentPaperIndex = 0;

          ${optionsHtml}
          <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${q.id}">
            <div class="exp-title">💡 官方考点与速通解析 【标准答案: ${q.answer}】</div>
            <div class="exp-content">${q.explanation}</div>
          </div>
        `;
        container.appendChild(card);
      });

      // Section 2: Blanks (15 questions, 30 points)
      const sec2Title = document.createElement('div');
      sec2Title.className = 'section-title';
      sec2Title.textContent = `第二部分：填空题（共 15 题，每题 2 分，共 30 分）`;
      container.appendChild(sec2Title);

      paper.blanks.forEach((b) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${b.id}`;

        const isMarked = markedQuestions.has(b.id);
        const userVal = getUserAnswer(b.id) || '';

        let inputClass = 'blank-input';
        if (isSubmitted || isStudyMode) {
          if (userVal.trim()) {
            if (checkBlankAnswer(userVal, b.answer)) inputClass += ' correct';
            else inputClass += ' wrong';
          }
        }

        card.innerHTML = `
          <div class="question-header">
            <span class="q-number">填空题 ${b.number}</span>
            <div class="q-title">${b.prompt} <span style="color:var(--primary); font-size:0.8rem;">(2分)</span></div>
            <button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="toggleMark('${b.id}')">
              ${isMarked ? '★ 已标记' : '☆ 标记'}
            </button>
          </div>
          <div class="blank-input-row" style="margin-top:10px;">
            <input type="text" class="${inputClass}" id="input_${b.id}"
              placeholder="${b.placeholder}" value="${escapeHtml(userVal)}"
              onchange="saveBlankAnswer('${b.id}', this.value)"
              onblur="saveBlankAnswer('${b.id}', this.value)">
            ${isStudyMode ? `<button class="btn btn-outline" style="padding:4px 8px;font-size:0.75rem;" onclick="showBlankHint('${b.id}', '${b.hint}')">提示</button>` : ''}
          </div>
          <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${b.id}">
            <div class="exp-title">💡 填空标准参考答案：${b.answer.join(' 或 ')}</div>
            <div class="exp-content">${b.hint}</div>
          </div>
        `;
        container.appendChild(card);
      });

      // Section 3: Applied Questions (2 big questions, 30 points)
      const sec3Title = document.createElement('div');
      sec3Title.className = 'section-title';
      sec3Title.textContent = `第三部分：设计与应用题（共 2 大题，每题 15 分，共 30 分）`;
      container.appendChild(sec3Title);

      paper.applied_questions.forEach((app) => {
        const appCard = document.createElement('div');
        appCard.className = 'question-card';
        appCard.id = `card_${app.id}`;

        let codeHtml = app.code_snippet ? `<div class="code-box">${escapeHtml(app.code_snippet)}</div>` : '';

        let subqsHtml = '';
        app.subquestions.forEach((sq) => {
          const userVal = getUserAnswer(sq.id) || '';
          let inputClass = 'blank-input';
          if (isSubmitted || isStudyMode) {
            if (userVal.trim()) {
              if (checkBlankAnswer(userVal, sq.answer)) inputClass += ' correct';
              else inputClass += ' wrong';
            }
          }

          subqsHtml += `
            <div class="blank-group">
              <div class="blank-label">${sq.prompt} <span style="color:var(--primary); font-size:0.8rem;">(${sq.score}分)</span></div>
              <div class="blank-input-row">
                <input type="text" class="${inputClass}" id="input_${sq.id}" 
                  placeholder="${sq.placeholder}" value="${escapeHtml(userVal)}"
                  onchange="saveBlankAnswer('${sq.id}', this.value)"
                  onblur="saveBlankAnswer('${sq.id}', this.value)">
                ${isStudyMode ? `<button class="btn btn-outline" style="padding:4px 8px;font-size:0.75rem;" onclick="showBlankHint('${sq.id}', '${sq.hint}')">提示</button>` : ''}
              </div>
              ${(isSubmitted || isStudyMode) ? `<div style="margin-top:6px; font-size:0.8rem; color:var(--text-muted);">【标准参考】${sq.answer.join(' 或 ')} | 提示: ${sq.hint}</div>` : ''}
            </div>
          `;
        });

        appCard.innerHTML = `
          <div class="question-header">
            <span class="q-number">应用题 ${app.number}</span>
            <div class="q-title">${app.title}</div>
          </div>
          <p style="font-size:0.95rem; color:var(--text);">${app.description}</p>
          ${codeHtml}
          ${subqsHtml}
          <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${app.id}">
            <div class="exp-title">💡 深度命题精析与考点推导</div>
            <div class="exp-content">${app.explanation}</div>
          </div>
        `;
        container.appendChild(appCard);
      });
    }

    // Palette Render
    function renderPalette() {
      const paper = papersData[currentPaperIndex];
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';

      let totalCount = 0;
      let answeredCount = 0;

      // 1. 40 MCQs
      paper.mcqs.forEach((q) => {
        totalCount++;
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = q.number;
        btn.id = `pal_${q.id}`;

        const ans = getUserAnswer(q.id);
        if (ans) {
          answeredCount++;
          btn.classList.add('done');
        }
        if (markedQuestions.has(q.id)) {
          btn.classList.add('marked');
        }

        if (isSubmitted) {
          if (ans === q.answer) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('wrong');
          }
        }

        btn.onclick = () => scrollToCard(`card_${q.id}`);
        grid.appendChild(btn);
      });

      // 2. 15 Blanks
      paper.blanks.forEach((b) => {
        totalCount++;
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = `填${b.number}`;
        btn.id = `pal_${b.id}`;

        const ans = getUserAnswer(b.id);
        if (ans) {
          answeredCount++;
          btn.classList.add('done');
        }
        if (markedQuestions.has(b.id)) {
          btn.classList.add('marked');
        }
        if (isSubmitted) {
          if (checkBlankAnswer(ans, b.answer)) btn.classList.add('correct');
          else btn.classList.add('wrong');
        }

        btn.onclick = () => scrollToCard(`card_${b.id}`);
        grid.appendChild(btn);
      });

      // 3. 2 Applied Questions
      paper.applied_questions.forEach((app) => {
        totalCount++;
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = `应${app.number}`;
        btn.id = `pal_${app.id}`;

        let done = app.subquestions.every(sq => !!getUserAnswer(sq.id));
        if (done) {
          answeredCount++;
          btn.classList.add('done');
        }
        btn.onclick = () => scrollToCard(`card_${app.id}`);
        grid.appendChild(btn);
      });

      document.getElementById('progressText').textContent = `${answeredCount} / ${totalCount}`;
    }

    // State Management
    function getUserAnswer(qId) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      return userAnswers[paperId][qId];
    }

    function selectOption(qId, letter) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      userAnswers[paperId][qId] = letter;
      renderQuestions();
      renderPalette();
    }

    function saveBlankAnswer(qId, val) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      userAnswers[paperId][qId] = val.trim();
      renderPalette();
    }

    function toggleMark(qId) {
      if (markedQuestions.has(qId)) markedQuestions.delete(qId);
      else markedQuestions.add(qId);
      renderQuestions();
      renderPalette();
    }

    function showBlankHint(qId, hint) {
      alert(`💡 考点提示：${hint}`);
    }

    function scrollToCard(cardId) {
      const el = document.getElementById(cardId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function checkBlankAnswer(userInput, correctList) {
      if (!userInput) return false;
      const cleanUser = userInput.trim().toLowerCase().replace(/\s+/g, '');
      return correctList.some(target => {
        const cleanTarget = target.trim().toLowerCase().replace(/\s+/g, '');
        return cleanUser === cleanTarget;
      });
    }

    // Submit Exam
    function submitExam() {
      isSubmitted = true;
      const paper = papersData[currentPaperIndex];

      let mcqScore = 0;
      let blankScore = 0;
      let appScore = 0;
      const wrongList = [];

      // 1. MCQs
      paper.mcqs.forEach((q) => {
        const ans = getUserAnswer(q.id);
        if (ans === q.answer) {
          mcqScore += 1;
        } else {
          wrongList.push(`第 ${q.number} 题（单选题）：考生选 ${ans || '未作答'}，标准答案 ${q.answer}`);
        }
      });

      // 2. Blanks
      paper.blanks.forEach((b) => {
        const ans = getUserAnswer(b.id);
        if (checkBlankAnswer(ans, b.answer)) {
          blankScore += b.score;
        } else {
          wrongList.push(`填空题 ${b.number}：考生填“${ans || '未填'}”，标准参考：“${b.answer[0]}”`);
        }
      });

      // 3. Applied Questions
      paper.applied_questions.forEach((app) => {
        app.subquestions.forEach((sq) => {
          const ans = getUserAnswer(sq.id);
          if (checkBlankAnswer(ans, sq.answer)) {
            appScore += sq.score;
          } else {
            wrongList.push(`应用题 ${app.number} - ${sq.prompt}：考生填“${ans || '未填'}”，参考：“${sq.answer[0]}”`);
          }
        });
      });

      const totalScore = mcqScore + blankScore + appScore;

      // Update Modal
      document.getElementById('modalScore').textContent = totalScore;
      document.getElementById('mcqScoreReport').textContent = `${mcqScore} / 40`;
      document.getElementById('blankScoreReport').textContent = `${blankScore} / 30`;
      document.getElementById('appScoreReport').textContent = `${appScore} / 30`;

      const title = document.getElementById('modalResultTitle');
      const subtitle = document.getElementById('modalResultSubtitle');
      if (totalScore >= 60) {
        title.innerHTML = '🎉 恭喜！您已顺利通过三级数据库技术模拟考试！';
        title.style.color = 'var(--success)';
        subtitle.textContent = `全国计算机等级考试及格线为 60 分，您的成绩已达到合格标准！`;
      } else {
        title.innerHTML = '⚠️ 暂未及格，请认真查漏补缺！';
        title.style.color = 'var(--danger)';
        subtitle.textContent = `距离 60 分合格线还差 ${60 - totalScore} 分，请仔细研读每题解析！`;
      }

      const wrongDiv = document.getElementById('wrongQuestionsList');
      if (wrongList.length === 0) {
        wrongDiv.innerHTML = '<div style="color:var(--success); font-weight:bold;">🔥 太厉害了！全卷满分零失误！</div>';
      } else {
        wrongDiv.innerHTML = wrongList.map(item => `<div style="padding:4px 0; border-bottom:1px dashed var(--border);">${item}</div>`).join('');
      }

      document.getElementById('scoreModal').classList.add('show');
      renderQuestions();
      renderPalette();
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('show');
    }

    function restartExam() {
      closeModal();
      resetCurrentPaper();
    }

    function resetCurrentPaper() {
      if (confirm('确认清空本套试卷的所有作答记录并重新作答吗？')) {
        const paperId = papersData[currentPaperIndex].id;
        userAnswers[paperId] = {};
        isSubmitted = false;
        renderQuestions();
        renderPalette();
        timeRemaining = 120 * 60;
      }
    }

    function toggleAllExplanations() {
      const boxes = document.querySelectorAll('.explanation-box');
      const anyHidden = Array.from(boxes).some(b => !b.classList.contains('show'));
      boxes.forEach(b => {
        if (anyHidden) b.classList.add('show');
        else b.classList.remove('show');
      });
    }

    // Timer
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isSubmitted && !isStudyMode) {
          timeRemaining--;
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert('⏰ 考试时间到！系统已为您自动交卷评分。');
            submitExam();
          }
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById('timerDisplay').textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
