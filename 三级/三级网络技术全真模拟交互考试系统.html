": "ACL 中允许为 permit，拒绝为 deny"}, {"id": "p2_c2_4", "score": 2, "prompt": "【空 4】财务部网段 192.168.10.0/24 对应的通配符反掩码：", "placeholder": "例如: 0.0.0.255", "answer": ["0.0.0.255"], "hint": "/24 对应反掩码 0.0.0.255"}, {"id": "p2_c2_5", "score": 2, "prompt": "【空 5】将 FastEthernet 0/24 端口配置为中继链路模式的命令参数：", "placeholder": "填 trunk 或 access", "answer": ["trunk"], "hint": "级联多 VLAN 中继模式为 trunk"}], "explanation": "【官方考点与速通解析】\n1. 空 1：HTTP 协议基于 TCP 传输层协议，因此配置 `permit tcp ...`；\n2. 空 2：HTTP 服务的标准端口号为 80，命令中填写 `eq 80` 或 `eq www`；\n3. 空 3：ACL 的动作关键字只有 `permit`（允许）和 `deny`（拒绝），此处要求拒绝访问其他服务，填 `deny`；\n4. 空 4：/24 掩码是 255.255.255.0，其通配符反掩码为 255.255.255.255 - 255.255.255.0 = 0.0.0.255；\n5. 空 5：级联 Trunk 链路配置命令为 `switchport mode trunk`。"}, {"id": "p2_c3", "number": 3, "score": 10, "title": "综合题三：DNS 服务器与 Serv-U FTP 高级配置（10分）", "description": "某单位使用 Windows Server 搭建企业内部网络服务。管理员在 DNS 控制台中新建了一个正向查找区域 `tech.com`，并在该区域下为内网 Web 服务器创建了名为 `www` 的主机记录，对应 IP 为 `202.113.64.10`；同时管理员创建了一个 Serv-U FTP 站点，要求监听在默认端口，并将最大并发连接数限制为 100。\n\n请阅读说明并回答下列配置参数填空：", "subquestions": [{"id": "p2_c3_1", "score": 2, "prompt": "【空 1】在 DNS 正向查找区域中，为 www.tech.com 映射 IPv4 地址所创建的记录类型名称为：", "placeholder": "填 A 记录 或 PTR 或 CNAME", "answer": ["A记录", "A", "A 记录"], "hint": "正向地址记录为 A 记录"}, {"id": "p2_c3_2", "score": 2, "prompt": "【空 2】若为该网站设置别名 ftp.tech.com 指向同一台主机，应创建的记录类型是：", "placeholder": "例如: CNAME", "answer": ["CNAME", "CNAME记录", "别名"], "hint": "别名记录为 CNAME（Canonical Name）"}, {"id": "p2_c3_3", "score": 2, "prompt": "【空 3】Serv-U FTP 服务的默认命令控制端口号是（填数字）：", "placeholder": "例如: 21", "answer": ["21"], "hint": "FTP 控制连接标准端口为 TCP 21"}, {"id": "p2_c3_4", "score": 2, "prompt": "【空 4】在 Serv-U 域限制与设置中，限制该站点最多允许同时在线的用户连接数为（填题干要求数字）：", "placeholder": "例如: 100", "answer": ["100"], "hint": "题干明确要求最大并发连接数限制为 100"}, {"id": "p2_c3_5", "score": 2, "prompt": "【空 5】在被动模式（PASV）下，向 FTP 服务器主动发起数据连接建立请求的一端是（填客户端或服务器）：", "placeholder": "填 客户端 或 服务器", "answer": ["客户端", "Client"], "hint": "被动模式 PASV 下由客户端向服务器开放的动态端口主动发起数据连接"}], "explanation": "【官方考点与速通解析】\n1. 空 1：DNS 正向解析建立域名到 IPv4 的映射是 A 记录；\n2. 空 2：给已有的正向主机记录赋予别名是 CNAME（规范名称记录）；\n3. 空 3：FTP 控制端口为 TCP 21（数据端口主动模式为 20）；\n4. 空 4：最大用户并发连接数配置为 100；\n5. 空 5：FTP 模式区分：\n   - 主动模式（PORT）：客户端从 1024 以上端口连接服务器 21 端口，服务器从 20 端口主动连接客户端的数据端口；\n   - 被动模式（PASV）：客户端连接服务器 21 端口发送 PASV 命令，服务器开启一个临时高位端口，由【客户端】向服务器临时端口主动发起数据连接（这对穿透客户端防火墙极其有利）。"}, {"id": "p2_c4", "number": 4, "score": 10, "title": "综合题四：Wireshark 抓取 TCP 三次握手过程报文分析（10分）", "description": "某网管在主机（IP：192.168.1.100）上使用 Wireshark 抓取访问 Web 服务器（IP：202.112.96.3:80）的数据包。下图是捕获到的 TCP 三次握手第一步数据包的解码信息：", "code_snippet": "Frame 1: 66 bytes on wire\nInternet Protocol Version 4, Src: 192.168.1.100, Dst: 202.112.96.3\nTransmission Control Protocol, Src Port: 51234, Dst Port: 80, Seq: 0, Len: 0\n    Source Port: 51234\n    Destination Port: 80\n    Sequence Number: 0 (relative sequence number)\n    Acknowledgment Number: 0\n    Header Length: 32 bytes\n    Flags: 0x002 (SYN)\n        000. .... .... = Reserved: Set\n        .... ..0. .... = Acknowledgment: Not set\n        .... ...0 .... = Push: Not set\n        .... .... 0... = Reset: Not set\n        .... .... .0.. = Syn: Set (1)\n        .... .... ..0. = Fin: Not set\n    Window size value: 64240", "subquestions": [{"id": "p2_c4_1", "score": 2, "prompt": "【空 1】该报文是 TCP 三次握手第 1 个报文，其激活的标志位是（填三个字母）：", "placeholder": "例如: SYN 或 ACK", "answer": ["SYN"], "hint": "Flags: 0x002 对应 SYN 置 1"}, {"id": "p2_c4_2", "score": 2, "prompt": "【空 2】客户端通信程序所使用的本地临时源端口号是（填数字）：", "placeholder": "例如: 51234", "answer": ["51234"], "hint": "看 Src Port: 51234"}, {"id": "p2_c4_3", "score": 2, "prompt": "【空 3】服务器收到该 SYN 报文后，回复的第 2 次握手报文中同时置 1 的两个标志位是（格式：XXX+XXX）：", "placeholder": "例如: SYN+ACK", "answer": ["SYN+ACK", "SYN/ACK", "SYN ACK"], "hint": "第 2 步握手由服务器响应 SYN+ACK"}, {"id": "p2_c4_4", "score": 2, "prompt": "【空 4】若第 1 次握手客户端初始序列号 Seq 为 1000，则第 2 次握手服务器返回的确认号 Ack 应为（填数字）：", "placeholder": "例如: 1001", "answer": ["1001"], "hint": "SYN 报文虽然载荷为 0，但逻辑上消耗 1 个序号，Ack = Seq + 1"}, {"id": "p2_c4_5", "score": 2, "prompt": "【空 5】客户端建立连接后随后发起的 HTTP GET 请求，其传输层协议采用的是（填 TCP 或 UDP）：", "placeholder": "填 TCP 或 UDP", "answer": ["TCP"], "hint": "HTTP/1.1 基于 TCP 传输"}], "explanation": "【官方考点与速通解析】\nTCP 三次握手过程详解：\n1. 第一次握手（Client -> Server）：客户端发送连接请求报文，标志位 SYN = 1，ACK = 0，随机选择初始序号 Seq = x（相对序号显示为 0）。源端口为客户端随机端口 51234，目的端口为 80。\n2. 第二次握手（Server -> Client）：服务器收到后同意建立连接，回复响应报文，标志位 SYN = 1 且 ACK = 1；同时确认号 Ack = x + 1（因为 SYN 占用 1 个逻辑序号），并产生服务器自身的初始序列号 Seq = y。\n3. 第三次握手（Client -> Server）：客户端回复最终确认报文，标志位 ACK = 1，Seq = x + 1，Ack = y + 1。至此 TCP 全双工连接正式建立，随后发起应用层 HTTP GET 请求。"}], "applied": {"id": "p2_app1", "number": 1, "score": 20, "title": "应用题：企业园区网络分层拓扑汇聚路由规划与 VLSM 划分（20分）", "description": "某高新技术园区网络拓扑结构如下图所示。园区核心路由器 R-Core 通过高速光纤串行链路 S0/0 和 S0/1 分别连接第一分部汇聚路由器 R-Agg1 和第二分部汇聚路由器 R-Agg2。\n\n【拓扑参数与网段规划】\n1. R-Core 到 R-Agg1 的直连点对点链路包含 IP：10.10.1.1 和 10.10.1.2（掩码 /30）；\n2. R-Core 到 R-Agg2 的直连点对点链路包含 IP：10.10.1.5 和 10.10.1.6（掩码 /30）；\n3. R-Agg1 下辖三个连续研发子网：10.10.16.0/24、10.10.17.0/24、10.10.18.0/24、10.10.19.0/24；\n4. R-Agg2 下辖四个连续生产子网：10.10.32.0/24、10.10.33.0/24、10.10.34.0/24、10.10.35.0/24；\n5. R-Agg1 上联端口为 S0/0，R-Agg2 上联端口为 S0/1。", "svg_diagram": "<svg viewBox=\"0 0 760 360\" width=\"100%\" height=\"300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <linearGradient id=\"gRouter2\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#0284c7\"/>\n      <stop offset=\"100%\" stop-color=\"#0369a1\"/>\n    </linearGradient>\n    <linearGradient id=\"gSwitch2\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#6366f1\"/>\n      <stop offset=\"100%\" stop-color=\"#4f46e5\"/>\n    </linearGradient>\n  </defs>\n  <rect width=\"100%\" height=\"100%\" fill=\"#f1f5f9\" rx=\"12\"/>\n  <text x=\"380\" y=\"30\" font-size=\"16\" font-weight=\"bold\" fill=\"#0f172a\" text-anchor=\"middle\">企业园区汇聚与核心分层拓扑图</text>\n  \n  <!-- Core Router -->\n  <circle cx=\"380\" cy=\"75\" r=\"28\" fill=\"url(#gRouter2)\" stroke=\"#0c4a6e\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"80\" font-size=\"13\" font-weight=\"bold\" fill=\"#ffffff\" text-anchor=\"middle\">R-Core</text>\n  <text x=\"380\" y=\"118\" font-size=\"11\" fill=\"#475569\" text-anchor=\"middle\">园区核心 (R-Core)</text>\n\n  <!-- Serial Links -->\n  <line x1=\"355\" y1=\"90\" x2=\"210\" y2=\"160\" stroke=\"#475569\" stroke-width=\"2.5\" stroke-dasharray=\"5\"/>\n  <text x=\"250\" y=\"115\" font-size=\"11\" fill=\"#0369a1\" font-weight=\"bold\">S0/0 (10.10.1.0/30)</text>\n\n  <line x1=\"405\" y1=\"90\" x2=\"550\" y2=\"160\" stroke=\"#475569\" stroke-width=\"2.5\" stroke-dasharray=\"5\"/>\n  <text x=\"490\" y=\"115\" font-size=\"11\" fill=\"#0369a1\" font-weight=\"bold\">S0/1 (10.10.1.4/30)</text>\n\n  <!-- Aggregation Routers -->\n  <circle cx=\"210\" cy=\"175\" r=\"26\" fill=\"url(#gRouter2)\" stroke=\"#0c4a6e\" stroke-width=\"2\"/>\n  <text x=\"210\" y=\"180\" font-size=\"12\" font-weight=\"bold\" fill=\"#ffffff\" text-anchor=\"middle\">R-Agg1</text>\n\n  <circle cx=\"550\" cy=\"175\" r=\"26\" fill=\"url(#gRouter2)\" stroke=\"#0c4a6e\" stroke-width=\"2\"/>\n  <text x=\"550\" y=\"180\" font-size=\"12\" font-weight=\"bold\" fill=\"#ffffff\" text-anchor=\"middle\">R-Agg2</text>\n\n  <!-- Links to Buildings -->\n  <line x1=\"190\" y1=\"195\" x2=\"130\" y2=\"255\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"195\" x2=\"290\" y2=\"255\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"530\" y1=\"195\" x2=\"470\" y2=\"255\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"570\" y1=\"195\" x2=\"630\" y2=\"255\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n  <!-- Subnet Boxes -->\n  <rect x=\"100\" y=\"255\" width=\"80\" height=\"32\" rx=\"6\" fill=\"url(#gSwitch2)\"/>\n  <text x=\"140\" y=\"275\" font-size=\"11\" fill=\"#ffffff\" text-anchor=\"middle\">10.10.16.0/24</text>\n\n  <rect x=\"250\" y=\"255\" width=\"80\" height=\"32\" rx=\"6\" fill=\"url(#gSwitch2)\"/>\n  <text x=\"290\" y=\"275\" font-size=\"11\" fill=\"#ffffff\" text-anchor=\"middle\">10.10.17.0/24</text>\n\n  <rect x=\"430\" y=\"255\" width=\"80\" height=\"32\" rx=\"6\" fill=\"url(#gSwitch2)\"/>\n  <text x=\"470\" y=\"275\" font-size=\"11\" fill=\"#ffffff\" text-anchor=\"middle\">10.10.32.0/24</text>\n\n  <rect x=\"590\" y=\"255\" width=\"80\" height=\"32\" rx=\"6\" fill=\"url(#gSwitch2)\"/>\n  <text x=\"630\" y=\"275\" font-size=\"11\" fill=\"#ffffff\" text-anchor=\"middle\">10.10.33.0/24</text>\n\n  <text x=\"210\" y=\"325\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">分部一汇聚超网: 10.10.16.0/22</text>\n  <text x=\"550\" y=\"325\" font-size=\"12\" fill=\"#1e293b\" text-anchor=\"middle\">分部二汇聚超网: 10.10.32.0/22</text>\n</svg>", "subquestions": [{"id": "p2_app1_1", "score": 3, "prompt": "【空 1】R-Core 到 R-Agg1 的直连链路（IP为10.10.1.1和10.10.1.2）的网络地址及掩码长度为：", "placeholder": "例如: 10.10.1.0/30", "answer": ["10.10.1.0/30"], "hint": "1 和 2 属于 10.10.1.0/30 网段"}, {"id": "p2_app1_2", "score": 3, "prompt": "【空 2】R-Core 到 R-Agg2 的直连链路（IP为10.10.1.5和10.10.1.6）的网络地址及掩码长度为：", "placeholder": "例如: 10.10.1.4/30", "answer": ["10.10.1.4/30"], "hint": "5 和 6 属于 10.10.1.4/30 网段"}, {"id": "p2_app1_3", "score": 3, "prompt": "【空 3】R-Agg1 下辖四个研发子网（10.10.16.0/24 ~ 10.10.19.0/24）汇聚后的超网路由条目为：", "placeholder": "例如: 10.10.16.0/22", "answer": ["10.10.16.0/22"], "hint": "16~19 连续 4 个 /24 汇聚为 /22"}, {"id": "p2_app1_4", "score": 3, "prompt": "【空 4】R-Agg2 下辖四个生产子网（10.10.32.0/24 ~ 10.10.35.0/24）汇聚后的超网路由条目为：", "placeholder": "例如: 10.10.32.0/22", "answer": ["10.10.32.0/22"], "hint": "32~35 连续 4 个 /24 汇聚为 /22"}, {"id": "p2_app1_5", "score": 2, "prompt": "【空 5】为实现内网主机的双网关冗余热备，在汇聚层交换机之间最常启用的网关冗余国际标准协议是（填大写英文）：", "placeholder": "填 VRRP 或 HSRP", "answer": ["VRRP"], "hint": "VRRP（虚拟路由器冗余协议）为开放国际标准协议"}, {"id": "p2_app1_6", "score": 6, "prompt": "【空 6】现将地址块 172.16.1.0/24 分配给三个部门：研发部（需 100 台主机）、市场部（需 50 台主机）、财务部（需 25 台主机）。请写出【研发部】和【市场部】划分后的子网掩码：", "placeholder": "格式: 研发部:255.255.255.128; 市场部:255.255.255.192", "answer": ["研发部:255.255.255.128; 市场部:255.255.255.192", "255.255.255.128 255.255.255.192", "255.255.255.128, 255.255.255.192"], "hint": "100 台主机需 2^7=128（/25，掩码 255.255.255.128）；50 台主机需 2^6=64（/26，掩码 255.255.255.192）"}], "explanation": "【官方考点与解析】\n1. 点对点链路计算：\n   - 10.10.1.1 和 10.10.1.2 占用块大小为 4（0~3），网络地址为 10.10.1.0/30；\n   - 10.10.1.5 和 10.10.1.6 占用块大小为 4（4~7），网络地址为 10.10.1.4/30；\n2. 路由汇聚计算：\n   - 研发部 16、17、18、19：第三字节分别为 00010000、00010001、00010010、00010011，前 6 位相同，汇聚后掩码长度由 24 变为 22 位，网络地址为 10.10.16.0/22；\n   - 生产部 32、33、34、35：第三字节分别为 00100000 ~ 00100011，汇聚后为 10.10.32.0/22；\n3. 网关冗余协议：VRRP（虚拟路由器冗余协议，RFC 标准；HSRP 为 Cisco 私有）；\n4. VLSM 划分计算：\n   - 研发部（100 台主机）：主机位需 7 位（2^7 - 2 = 126 > 100），前缀为 32 - 7 = 25 位。子网掩码：255.255.255.128。网段：172.16.1.0/25，可用范围 172.16.1.1 ~ 172.16.1.126；\n   - 市场部（50 台主机）：主机位需 6 位（2^6 - 2 = 62 > 50），前缀为 32 - 6 = 26 位。子网掩码：255.255.255.192。网段：172.16.1.128/26，可用范围 172.16.1.129 ~ 172.16.1.190。"}}, {"id": "paper3", "title": "全国计算机等级考试三级网络技术·全真模拟试卷（三）", "subtitle": "前沿演进与冲刺密押卷 · 聚焦 IPv6、云安全与现代网络技术", "duration": 120, "total_score": 100, "mcq_score": 40, "comp_score": 40, "app_score": 20, "mcqs": [{"id": "p3_m1", "number": 1, "title": "光纤分布式数据接口（FDDI）采用双环拓扑结构。下列关于 FDDI 技术的描述中，错误的是（ ）。", "options": ["A. FDDI 采用光纤作为物理传输介质，标准传输速率为 100 Mbps", "B. FDDI 采用与 IEEE 802.5 令牌环类似的令牌传递（Token Ring）介质访问控制协议", "C. FDDI 主环和副环在正常工作状态下同时反向并发传输用户业务数据", "D. 当主环发生断裂时，主环与副环可在故障两端自动环回（Wrap），重构为单环"], "answer": "C", "hint": "FDDI 正常情况下只有主环传输数据，副环作为热备份；只有故障环回时才闭合使用", "explanation": "【官方考点与速通解析】\nFDDI（光纤分布式数据接口）核心特性：\n- 传输介质为光纤，速率为 100 Mbps，最大环路长度为 100 km；\n- 采用双环结构（主环与副环），【正常工作时只有主环负责传输数据】，副环处于完全空闲的待命备用状态（与 RPR 两环均传数据不同！）；\n- 当主环出现单点断纤故障时，邻近断点的两台站点会自动将主环与副环短接，形成一个闭合的大单环自愈运行。故 C 选项描述错误。"}, {"id": "p3_m2", "number": 2, "title": "某企业核心交换机拥有 32 个 1000 Mbps 千兆全双工光端口和 4 个 10 Gbps 万兆全双工光端口。若要实现所有端口无阻塞线速交换，该交换机的背板交换容量至少应达到（ ）。", "options": ["A. 72 Gbps", "B. 144 Gbps", "C. 36 Gbps", "D. 288 Gbps"], "answer": "B", "hint": "总带宽 = 2 × (32 × 1Gbps + 4 × 10Gbps) = 2 × (32 + 40) = 144 Gbps", "explanation": "【官方考点与速通解析】\n背板带宽（交换容量）全双工线速计算公式：\n背板交换容量 ≥ 2 × ∑(端口数 × 端口额定速率)\n- 32 个千兆（1 Gbps）端口：32 × 1 Gbps = 32 Gbps\n- 4 个万兆（10 Gbps）端口：4 × 10 Gbps = 40 Gbps\n- 单向速率之和 = 32 + 40 = 72 Gbps\n- 全双工要求背板带宽 ≥ 72 Gbps × 2 = 144 Gbps。故选 B。"}, {"id": "p3_m3", "number": 3, "title": "某中小型数据中心网络系统的年度系统可用性设计目标为 99.9%。这意味着该数据中心一整年允许的非计划停机维护时间上限为（ ）。", "options": ["A. 5 分钟", "B. 53 分钟", "C. 8.8 小时", "D. 24 小时"], "answer": "C", "hint": "3个9（99.9%）对应 8.8 小时；4个9对应 53 分钟；5个9对应 5 分钟", "explanation": "【官方考点与速通解析】\n一年总时间 = 365 × 24 = 8760 小时。\n99.9% 的可用性意味着故障停机率不超过 0.1%：\n停机时间 ≤ 8760 小时 × 0.001 = 8.76 小时 ≈ 8.8 小时。选 C。"}, {"id": "p3_m4", "number": 4, "title": "某网络分配到的 IP 地址块为 192.168.64.0/21。该地址块的子网掩码用点分十进制表示为（ ）。", "options": ["A. 255.255.240.0", "B. 255.255.248.0", "C. 255.255.252.0", "D. 255.255.224.0"], "answer": "B", "hint": "/21 即前 21 位为 1，第 3 字节高 5 位为 1（11111000 = 248）", "explanation": "【官方考点与速通解析】\n/21 表示子网掩码有连续 21 个 1：\n- 第 1、2 字节：全 1，对应 255.255\n- 第 3 字节：高 5 位为 1，低 3 位为 0 -> 11111000 = 128 + 64 + 32 + 16 + 8 = 248\n- 第 4 字节：全 0，对应 0\n因此子网掩码为 255.255.248.0，选 B。"}, {"id": "p3_m5", "number": 5, "title": "在 Cisco 路由器上配置动态 NAPT（网络地址与端口多路复用）时，将内部私网 ACL 访问列表与外部公网出接口（如 FastEthernet 0/0）进行关联绑定的核心关键字是（ ）。", "options": ["A. overload", "B. pool", "C. static", "D. dynamic"], "answer": "A", "hint": "Cisco PAT/NAPT 命令末尾必加关键字 overload（过载）", "explanation": "【官方考点与速通解析】\nCisco 路由器配置端口多路复用 NAPT 的经典命令格式：\n`ip nat inside source list 1 interface fastethernet 0/0 overload`\n关键字 `overload`（过载）指示路由器使用出接口的单个公网 IP 地址，并通过分配不同的 TCP/UDP 源端口号来区分内部各主机的并发会话。故选 A。"}, {"id": "p3_m6", "number": 6, "title": "IPv6 规定了若干具有特定用途的专用保留地址。下列关于 IPv6 特殊地址的描述中，错误的是（ ）。", "options": ["A. ::1/128 表示本机环回地址（相当于 IPv4 的 127.0.0.1）", "B. ::/128 表示未指定地址（相当于 IPv4 的 0.0.0.0）", "C. fe80::/10 是链路本地单播地址（Link-Local Address）的前缀", "D. 2001::/16 是唯一的私有本地网络单播地址前缀"], "answer": "D", "hint": "私有本地地址（Unique Local Address，相当于私网IP）的前缀是 fc00::/7（或 fd00::/8），2001:: 是全球单播公网地址", "explanation": "【官方考点与速通解析】\nIPv6 经典地址分类：\n- `::1/128`：环回地址（Loopback）；\n- `::/128`：未指定地址（Unspecified）；\n- `fe80::/10`：链路本地地址（Link-Local），无需路由器在单个二层链路上自动生成并通信；\n- `fc00::/7`（特别是 `fd00::/8`）：唯一本地单播地址（ULA，相当于 IPv4 私网私有地址）；\n- `2000::/3`（包含 `2001::/16`）：全球单播地址（GUA，公网可路由地址）。故 D 错误。"}, {"id": "p3_m7", "number": 7, "title": "IEEE 802.11ac（Wi-Fi 5）是现代无线网络的主力规范。下列关于 802.11ac 的描述中，错误的是（ ）。", "options": ["A. 802.11ac 仅工作在 5 GHz 纯净频段，完全不占用拥挤的 2.4 GHz 频段", "B. 802.11ac 引入了下行多用户多输入多输出（DL MU-MIMO）技术", "C. 802.11ac 最大信道频宽可绑定达到 80 MHz 甚至 160 MHz", "D. 802.11ac 最高理论传输速率受限于 54 Mbps"], "answer": "D", "hint": "802.11ac 理论最高速率可达数 Gbps，54 Mbps 是老旧的 802.11a/g 速率", "explanation": "【官方考点与速通解析】\nIEEE 802.11ac（Wi-Fi 5）特性：\n- 只工作在 5 GHz 频段（2.4 GHz 由 802.11n 继续承担）；\n- 采用 256-QAM 调制，信道频宽扩至 80/160 MHz，支持 8 空间流；\n- 支持下行 MU-MIMO；\n- 最高理论物理层协商速率超过 1 Gbps（最高可达 3.47~6.9 Gbps），绝不是 54 Mbps。故选 D。"}, {"id": "p3_m8", "number": 8, "title": "在无源光网络（PON）技术标准中，吉比特无源光网络（GPON）是由 ITU-T 制定的大带宽标准。GPON 系统的标准下行和上行非对称速率分别为（ ）。", "options": ["A. 下行 2.488 Gbps，上行 1.244 Gbps", "B. 下行 1.25 Gbps，上行 1.25 Gbps", "C. 下行 10 Gbps，上行 10 Gbps", "D. 下行 100 Mbps，上行 100 Mbps"], "answer": "A", "hint": "GPON 下行 2.5G（2.488Gbps），上行 1.25G（1.244Gbps）；EPON 上下行对称 1.25Gbps", "explanation": "【官方考点与速通解析】\nPON 标准速率对比：\n- EPON（IEEE 802.3ah）：基于千兆以太网，上下行对称速率为 1.25 Gbps；\n- GPON（ITU-T G.984）：采用 GEM 封装协议，标准速率为下行 2.488 Gbps、上行 1.244 Gbps（也可以支持对称 2.488 Gbps），传输效率与分光比均优于 EPON。选 A。"}, {"id": "p3_m9", "number": 9, "title": "在服务器独立磁盘冗余阵列（RAID）技术中，RAID 5 兼顾了存储性能、数据安全与成本。关于 RAID 5 的描述中，正确的是（ ）。", "options": ["A. RAID 5 组建阵列至少需要 2 块物理硬盘", "B. RAID 5 将奇偶校验信息集中保存在一块专用的独立校验盘上", "C. RAID 5 采用分布式奇偶校验，允许阵列中最多同时损坏 1 块硬盘而数据不丢失", "D. RAID 5 阵列的实际有效存储容量等于所有物理硬盘容量的直接累加"], "answer": "C", "hint": "RAID 5 至少需 3 块盘，奇偶校验循环均匀分布在各盘，只允许坏 1 块盘，容量为 (N-1)×单盘容量", "explanation": "【官方考点与速通解析】\nRAID 5 核心机制：\n- 最少磁盘数：至少需要 3 块物理硬盘；\n- 校验机制：采用分布式奇偶校验（Parity 分布在所有磁盘上，没有专用校验盘，避免了写瓶颈，专用校验盘是 RAID 3/4）；\n- 容错能力：允许任意损坏 1 块磁盘，更换后可利用其余盘数据重构；若同时坏 2 块则数据损毁（允许坏 2 块的是 RAID 6）；\n- 有效可用容量：(N - 1) × 磁盘单盘容量（损失 1 块盘的空间作为校验）。故选 C。"}, {"id": "p3_m10", "number": 10, "title": "边界网关协议（BGP-4）在运行过程中定义了 4 种报文类型。其中用于在发生协议差错或需要关闭 BGP 会话时通知对等体的报文是（ ）。", "options": ["A. Open 报文", "B. Update 报文", "C. Keepalive 报文", "D. Notification 报文"], "answer": "D", "hint": "Notification 报文专用于报告差错并断开 BGP 连接", "explanation": "【官方考点与速通解析】\nBGP-4 的 4 种报文类型及职责：\n1. Open 报文：在 TCP 连接建立后，用于建立 BGP 对等体连接并协商参数（如 AS 号、BGP 版本、Hold time）；\n2. Update 报文：通告可达路由更新或撤销不可达路由；\n3. Keepalive 报文：周期性（通常 60 秒）发送，用于维持 BGP 连接有效性；\n4. Notification 报文：检测到错误或异常时发送，通知对方错误原因并立即断开 BGP 会话。选 D。"}, {"id": "p3_m11", "number": 11, "title": "在大型 OSPF 网络中，为了减小非骨干区域内路由器的路由表规模和 LSDB 内存占用，通常将边缘区域配置为末梢区域（Stub Area）。在 Stub 区域内部绝不允许泛洪的 LSA 类型是（ ）。", "options": ["A. Type 1 LSA（Router LSA）", "B. Type 2 LSA（Network LSA）", "C. Type 3 LSA（Summary LSA）", "D. Type 5 LSA（AS External LSA）"], "answer": "D", "hint": "Stub 区域彻底阻断 5 类外部 LSA，由 ABR 注入一条默认 3 类路由代替", "explanation": "【官方考点与速通解析】\nOSPF 特殊区域规则：\n- Stub（末梢）区域：阻断由 ASBR 产生的 Type 4（ASBR Summary）和 Type 5（AS External）外部 LSA，由区域边界路由器（ABR）自动生成一条指向自身的 Type 3 默认路由（0.0.0.0/0）发布给区域内路由器，极大缩减了路由表；\n- Totally Stub（完全末梢）区域：不仅阻断 Type 4 和 Type 5，还阻断除默认路由外的所有 Type 3 LSA。故选 D。"}, {"id": "p3_m12", "number": 12, "title": "三层交换机（Layer 3 Switch）在局域网内部实现了线速的路由转发。其赖以实现线速吞吐的核心硬件机制通常被称为（ ）。", "options": ["A. 软件慢速转发", "B. 一次路由，多次交换（基于硬件 ASIC/CEF 转发）", "C. 纯 CPU 逐包解封装计算", "D. 周期性广播泛洪"], "answer": "B", "hint": "经典考点：“一次路由，多次交换”（或基于硬件 FIB / 邻接表的 CEF 快速转发）", "explanation": "【官方考点与速通解析】\n传统路由器依赖 CPU 操作系统对每个数据包逐包解封装、查路由表计算下一跳并重新封帧，速度受限。\n三层交换机结合了二层交换的高速与三层路由的灵活，其核心机制是“一次路由，多次交换”：首个数据包触发路由引擎计算，随即将路由和 ARP 结果固化下载到专用的硬件 ASIC 芯片转发信息库（FIB）中；后续同一数据流的报文全部由专用硬件 ASIC 芯片在物理端口间直接线速线速线速转发。选 B。"}, {"id": "p3_m13", "number": 13, "title": "在 IEEE 802.1Q 标准以太网数据帧中，用于唯一标识该数据帧所属 VLAN 的 VLAN ID（VID）字段占用的二进制位数为（ ）。", "options": ["A. 8 位", "B. 12 位", "C. 16 位", "D. 32 位"], "answer": "B", "hint": "802.1Q 标签总共 4 字节（32位），其中 VID 占 12 位，支持 2^12 = 4096 个 VLAN", "explanation": "【官方考点与速通解析】\n802.1Q 标记（Tag）内部结构（总共 4 字节 = 32 位）：\n- TPID（标记协议标识符）：16 位，固定为十六进制 0x8100；\n- PRI（优先级）：3 位，用于 802.1p 服务质量；\n- CFI / DEI（规范格式指示符）：1 位；\n- VID（VLAN 标识符）：12 位，取值范围为 0 ~ 4095（其中 0 和 4095 保留，有效 VLAN ID 范围为 1 ~ 4094）。故选 B。"}, {"id": "p3_m14", "number": 14, "title": "在生成树协议（STP）的拓扑收敛过程中，一台非根交换机上有且仅有一个端口负责向根网桥方向转发数据，该端口的角色被称为（ ）。", "options": ["A. 根端口（Root Port）", "B. 指定端口（Designated Port）", "C. 阻塞端口（Blocking Port）", "D. 备份端口（Backup Port）"], "answer": "A", "hint": "非根交换机上去往根桥路径开销最小的端口称为根端口（RP）", "explanation": "【官方考点与速通解析】\nSTP 端口角色划分：\n1. 根网桥（Root Bridge）：BID 最小的交换机，所有工作端口都是指定端口（DP）；\n2. 根端口（Root Port，RP）：在每个【非根交换机】上有且仅有一个，是到达根网桥路径开销（Cost）最小的端口；\n3. 指定端口（Designated Port，DP）：在每个【网段/链路】上有且仅有一个，负责向该网段转发数据；\n4. 阻塞端口（Blocking/Alternate Port）：既不是 RP 也不是 DP 的端口，进入阻塞状态阻断环路。选 A。"}, {"id": "p3_m15", "number": 15, "title": "互联网域名系统（DNS）由分布在全球的层次化域名服务器组成。全球互联网共有（ ）个根域名服务器标识（由英文字母 A 到 M 命名）。", "options": ["A. 7 个", "B. 10 个", "C. 13 个", "D. 24 个"], "answer": "C", "hint": "经典网络常识：全球 IPv4 根域名服务器标识共有 13 个（A.ROOT-SERVERS.NET ~ M）", "explanation": "【官方考点与速通解析】\n由于传统 DNS 报文在 UDP 数据报中受限于 512 字节的最大长度限制，在早期协议规范中，全球根域名服务器的逻辑 IP 数量被严格限制为 13 个，分别以 A 到 M 命名（A.ROOT-SERVERS.NET ~ M.ROOT-SERVERS.NET）。现代通过 BGP Anycast（任播）技术，这 13 个逻辑根域名节点在全球实际部署了超过上千台镜像物理服务器。故选 C。"}, {"id": "p3_m16", "number": 16, "title": "在 Windows 客户端命令行执行（ ）命令，可以主动向 DHCP 服务器交还并显式释放当前网卡已租用的 IPv4 地址。", "options": ["A. ipconfig /renew", "B. ipconfig /release", "C. ipconfig /flushdns", "D. ipconfig /all"], "answer": "B", "hint": "release 为释放租约，renew 为重新申请租约，flushdns 为刷新 DNS 缓存", "explanation": "【官方考点与速通解析】\n- `ipconfig /release`：向 DHCP 服务器发送 DHCP Release 报文，主动归还并释放当前已分配的 IP 租约；\n- `ipconfig /renew`：向 DHCP 服务器重新发起请求获取或续签 IP 租约；\n- `ipconfig /flushdns`：清空本地 DNS 客户端解析缓存；\n- `ipconfig /all`：显示网卡完整详细配置（包含 MAC、DNS、租约时间等）。故选 B。"}, {"id": "p3_m17", "number": 17, "title": "在 Windows Server IIS Web 服务器的身份验证配置中，若需要将用户名和密码以明文（仅经过极易逆向的 Base64 编码）在网络上传输，该身份验证方式是（ ）。", "options": ["A. 匿名身份验证", "B. 基本身份验证（Basic Authentication）", "C. Windows 集成身份验证", "D. 摘要身份验证（Digest Authentication）"], "answer": "B", "hint": "基本身份验证（Basic）以 Base64 明文传输密码，若无 SSL 加密极易被嗅探窃取", "explanation": "【官方考点与速通解析】\nIIS 常见身份验证方式：\n- 匿名身份验证：允许任何未知用户无需输入凭据即可访问公共内容；\n- 基本身份验证（Basic）：浏览器弹出登录框，用户名与密码使用 Base64 算法编码传输。Base64 仅是编码而非加密，嗅探者拿到即可秒级解码出原始明文，因此安全性极低，通常必须配合 HTTPS/SSL 使用；\n- 摘要身份验证（Digest）：通过 MD5 哈希散列传递认证挑战；\n- Windows 集成认证（NTLM/Kerberos）：安全性最高，利用 Windows 域协议交互，不传输明文密码。选 B。"}, {"id": "p3_m18", "number": 18, "title": "现代状态检测防火墙（Stateful Inspection Firewall）相对于早期简单包过滤防火墙的核心技术创新在于（ ）。", "options": ["A. 仅检查数据链路层 MAC 地址", "B. 维护动态会话连接状态表（State Table），对正向会话建立的后续双向报文实施智能放行", "C. 彻底关闭所有出入方向的 UDP 数据流", "D. 完全不需要配置任何访问控制策略"], "answer": "B", "hint": "状态检测防火墙核心在“状态表（State Table）”，自动记录会话上下文", "explanation": "【官方考点与速通解析】\n传统包过滤防火墙逐包孤立检查五元组，无法识别数据包之间的会话逻辑。\n状态检测防火墙工作在网络层与传输层，维护一张动态的【连接状态表（State Table）】。当内网主机主动发起向外的 TCP/UDP 连接时，防火墙动态记录该会话信息；当外网服务器返回属于该已有会话的反向响应报文时，防火墙查询状态表直接快速放行，无需管理员在反方向手工配置冗余开放端口，大幅提升了安全性和性能。选 B。"}, {"id": "p3_m19", "number": 19, "title": "云计算底层广泛应用了服务器虚拟化技术。其中 Hypervisor（虚拟机监视器）直接运行在物理硬件裸机之上、不依赖任何底层宿主操作系统的虚拟化架构被称为（ ）。", "options": ["A. Type 1（裸金属型 / Bare-Metal）虚拟化", "B. Type 2（宿主型 / Hosted）虚拟化", "C. 容器（Container）虚拟化", "D. 桌面进程仿真"], "answer": "A", "hint": "Type 1 为裸金属（如 ESXi），直接装在硬件上；Type 2 为宿主型（如 VMware Workstation）装在现有系统上", "explanation": "【官方考点与速通解析】\n虚拟化 Hypervisor 分类：\n- Type 1（裸金属架构 / Bare-Metal）：Hypervisor 自身就是一个精简底层的操作系统内核，直接安装在物理裸机硬件上，虚拟机直接受其管理调度，性能高、开销极小。代表产品：VMware ESXi、Citrix XenServer、KVM；\n- Type 2（宿主型架构 / Hosted）：Hypervisor 作为普通应用程序安装在已有的 Windows 或 Linux 宿主操作系统上。代表产品：VMware Workstation、VirtualBox。故选 A。"}, {"id": "p3_m20", "number": 20, "title": "在低功耗广域物联网（LPWAN）通信技术中，由 3GPP 主导标准化并可直接部署在蜂窝移动通信网络上的技术是（ ）。", "options": ["A. NB-IoT（窄带物联网）", "B. LoRa", "C. ZigBee", "D. 经典蓝牙"], "answer": "A", "hint": "NB-IoT 是电信运营商授权蜂窝频段技术；LoRa 工作在非授权频段", "explanation": "【官方考点与速通解析】\nLPWAN（低功耗广域网）两大主流阵营：\n1. NB-IoT（Narrowband IoT，窄带物联网）：由 3GPP 组织制定，工作在运营商授权的蜂窝频段，直接利旧或升级现有 LTE 移动基站即可实现超广覆盖、海量连接与极低功耗；\n2. LoRa / Sigfox：工作在非授权免许可频段（Sub-1GHz ISM 频段），通常由企业自建私有网关与基站。故选 A。"}, {"id": "p3_m21", "number": 21, "title": "在 IPv6 协议体系中，用于取代 IPv4 中的 ARP（地址解析协议）并实现邻居节点 MAC 地址动态解析的核心协议是（ ）。", "options": ["A. ICMPv6 邻居发现协议（NDP）", "B. IGMP 组播管理协议", "C. RARP 反向地址转换协议", "D. RIPng 动态路由协议"], "answer": "A", "hint": "IPv6 用 ICMPv6 NDP（邻居发现协议）取代了 IPv4 中的 ARP", "explanation": "【官方考点与速通解析】\nIPv6 彻底移除了 IPv4 的 ARP 协议，取而代之的是集成在 ICMPv6 中的 NDP（Neighbor Discovery Protocol，邻居发现协议）。\nNDP 通过组播发送【邻居请求（NS，Type 135）】报文和【邻居通告（NA，Type 136）】报文来解析邻居链路层 MAC 地址，同时还负责路由器发现、无状态地址自动配置（SLAAC）以及重复地址检测（DAD）。选 A。"}, {"id": "p3_m22", "number": 22, "title": "宽带网络中家庭用户通过光纤宽带上网时，终端设备向运营商宽带接入服务器（BRAS）发起身份认证并获取公网 IP 所使用的标准接入协议是（ ）。", "options": ["A. PPPoE", "B. HDLC", "C. SLIP", "D. Frame Relay"], "answer": "A", "hint": "家庭宽带拨号上网协议为 PPPoE（以太网上的点对点协议）", "explanation": "【官方考点与速通解析】\nPPPoE（Point-to-Point Protocol over Ethernet，以太网上的点对点协议）将传统的 PPP 链路协议封装在以太网帧中传输。\n运营商通过 PPPoE 能够在广播式的以太网/光纤局域网接入架构下，实现单用户的独立身份认证（PAP/CHAP 账号密码校验）、计费控制、动态分配 IP 地址以及带宽限速。选 A。"}, {"id": "p3_m23", "number": 23, "title": "在安全网络运维中，远程登录管理交换机和路由器时，能够提供强加密保密、完整性校验及公私钥身份认证的网络协议是（ ）。", "options": ["A. SSH（端口 22）", "B. Telnet（端口 23）", "C. TFTP（端口 69）", "D. HTTP（端口 80）"], "answer": "A", "hint": "SSH 运行在 TCP 22 端口，全流程密文传输；Telnet 运行在 TCP 23 端口，明文传输已被淘汰", "explanation": "【官方考点与速通解析】\n- Telnet（TCP 23 端口）：早期的远程终端管理协议，所有传输数据（包括管理员登录口令）全部采用未加密的明文传输，极易被局域网嗅探抓包窃取，现代网络已被严格禁用；\n- SSH（Secure Shell，TCP 22 端口）：建立在应用层基础上的安全传输协议，利用非对称公钥和对称密钥对所有会话指令和密码进行强加密，全面取代 Telnet。选 A。"}, {"id": "p3_m24", "number": 24, "title": "以太网链路聚合技术（IEEE 802.3ad / LACP）能够将交换机之间的多个物理以太网端口捆绑为一个逻辑聚合端口。关于链路聚合的作用，描述错误的是（ ）。", "options": ["A. 成倍提升交换机级联骨干链路的总可用带宽", "B. 当聚合组内某一条物理物理光纤断裂时，流量在毫秒级内自动切换到其余健康链路", "C. 彻底改变底层以太网的标准帧结构，不再遵循 IEEE 802.3 帧格式", "D. 避免了由于多个物理连接产生环路而被 STP 生成树协议阻塞端口的问题"], "answer": "C", "hint": "链路聚合保持标准以太网帧结构不变，只是在逻辑层进行流量负荷分担", "explanation": "【官方考点与速通解析】\n链路聚合（Link Aggregation / EtherChannel / LACP）的三大核心优势：\n1. 增加链路带宽：将 2~8 个物理端口捆绑为一个逻辑 Port-Channel，带宽成倍累加；\n2. 提高网络可靠性：组内物理链路互为热备，单条链路断开自动故障转移；\n3. 优化生成树计算：在 STP 眼中，整个聚合组被视为单个逻辑接口，不会因多物理连线被 STP 识别为环路而阻断。\n链路聚合完全兼容标准的以太网帧结构，并未改变帧格式。故 C 描述错误。"}, {"id": "p3_m25", "number": 25, "title": "当前全球网络空间安全领域倡导的“零信任”（Zero Trust）安全架构，其核心设计理念与根本原则是（ ）。", "options": ["A. 默认信任企业内网的一切访问，只严格防御外网流量", "B. 持续验证，永不信任（Never Trust, Always Verify）", "C. 只要用户通过了单点登录密码校验，后续操作无需再受监控", "D. 彻底关闭所有内部服务器的防火墙"], "answer": "B", "hint": "零信任三大哲学：持续验证永不信任、基于最小特权原则、假定发生安全漏洞", "explanation": "【官方考点与速通解析】\n传统网络安全基于“边界防御”理念（内网即可信，外网即危险），一旦黑客攻破边界即在内网横向横行。\n“零信任”（Zero Trust）打破了网络位置的信任假定，其核心格言是“持续验证，永不信任”：无论请求来自于互联网公网还是企业核心内网，系统都一视同仁地将其视为不可信，针对每一次访问请求均要求进行动态的身份认证、设备健康检测、上下文评估及最小权限授权。选 B。"}, {"id": "p3_m26", "number": 26, "title": "在光纤通信系统中，SC 型和 LC 型是常见的光纤连接器接口类型。关于这两种接口的描述，正确的是（ ）。", "options": ["A. SC 接头是小方口插拔式，LC 接头是大方口插拔式", "B. LC 接头是小方口插拔式（高密度 SFP 光模块常用），SC 接头是大方口插拔式", "C. ST 接头是卡扣旋入式圆头，SC 接头是圆头螺口", "D. 光纤接头颜色与光纤单模/多模物理特性完全无关"], "answer": "B", "hint": "LC 是小方头（小型化高密模块 SFP 常用）；SC 是大方头（GBIC 模块常用）；ST 是圆形卡扣式", "explanation": "【官方考点与速通解析】\n光纤跳线接头常考类型：\n- SC 型连接器：外壳呈矩形的大方头，插拔销闩式固定，常用于早期路由器光纤接口或机房光纤终端盒；\n- LC 型连接器：外壳呈小方头（尺寸仅为 SC 的一半），采用模块化插孔（RJ）闩锁机构，常用于高密度交换机 SFP / SFP+ 光模块；\n- ST 型连接器：卡扣式圆形接头，旋入拧紧。选 B。"}, {"id": "p3_m27", "number": 27, "title": "在 Windows 操作系统中，若要彻底清除本地计算机上解析过的所有 DNS 域名解析客户端缓存，应执行的命令是（ ）。", "options": ["A. ipconfig /flushdns", "B. ipconfig /displaydns", "C. arp -d *", "D. netstat -r"], "answer": "A", "hint": "flush 即冲刷、清空，/flushdns 清空本地 DNS 解析缓存", "explanation": "【官方考点与速通解析】\n- `ipconfig /flushdns`：刷新并清空 Windows 本地解析程序缓存（解决网站改 IP 后本地依然解析到旧 IP 的问题）；\n- `ipconfig /displaydns`：打印显示当前本地缓存的所有 DNS 条目；\n- `arp -d *`：清空 ARP 映射缓存；\n- `netstat -r`：显示内核 IP 路由表。故选 A。"}, {"id": "p3_m28", "number": 28, "title": "在 Linux 操作系统中，用于配置网络接口 IP 地址、子网掩码以及激活/停用网卡的经典网络配置工具是（ ）。", "options": ["A. ifconfig", "B. iptables", "C. named", "D. traceroute"], "answer": "A", "hint": "Linux 下查看和配置接口参数的命令是 ifconfig（或 ip addr）", "explanation": "【官方考点与速通解析】\n- ifconfig（Interface Configuration）：Linux 经典网卡管理命令，用于查看 IP、MAC，配置静态 IP 与掩码（如 `ifconfig eth0 192.168.1.10 netmask 255.255.255.0 up`）；\n- iptables：Linux 内核网络包过滤与防火墙配置工具；\n- named：BIND DNS 服务的守护进程；\n- traceroute：路由追踪工具。选 A。"}, {"id": "p3_m29", "number": 29, "title": "在园区网络中配置 DHCP 服务时，网络管理员为了防止某些重要服务器或打印机的 IP 地址发生变更，应在 DHCP 服务器上配置的特性是（ ）。", "options": ["A. 动态地址池（Pool）", "B. 地址保留（Reservation，绑定特定 MAC 地址）", "C. 缩短租约有效期限", "D. 开启 DHCP Snooping 监听"], "answer": "B", "hint": "固定设备使用 DHCP 地址保留（Reservation），将 IP 与硬件 MAC 地址绑定", "explanation": "【官方考点与速通解析】\nDHCP 地址保留（Reservation）：\n管理员在 DHCP 作用域中，将特定的 IP 地址与目标网络设备（如网络打印机、内网文件服务器）的网卡物理 MAC 地址进行静态绑定。\n这样既保持了设备参数全部由 DHCP 集中下发管理的便利性，又确保了该设备每次开机租用到的始终是同一个固定不变的 IP 地址。选 B。"}, {"id": "p3_m30", "number": 30, "title": "在计算机网络体系结构中，OSI 参考模型与 TCP/IP 体系模型存在对应映射关系。下列协议中，工作在 TCP/IP 模型“网络互联层”（对应 OSI 网络层）的是（ ）。", "options": ["A. ICMP", "B. TCP", "C. HTTP", "D. Ethernet"], "answer": "A", "hint": "网络层四大核心协议：IP、ICMP、IGMP、ARP（或介于链路层与网络层之间）", "explanation": "【官方考点与速通解析】\nTCP/IP 层次模型与协议映射：\n- 应用层：HTTP、FTP、DNS、SMTP、DHCP、Telnet；\n- 传输层：TCP、UDP；\n- 网络层（网络互联层）：IP、ICMP（网际控制报文协议）、IGMP（网际组管理协议）；\n- 网络接口层：Ethernet、Wi-Fi、PPP。故选 A。"}, {"id": "p3_m31", "number": 31, "title": "在光纤通信波分复用（WDM）技术中，密集波分复用（DWDM）相比粗波分复用（CWDM）的核心技术优势在于（ ）。", "options": ["A. 波长信道间隔更窄（≤1.6nm），在单根光纤上能够复用数十乃至上百个光波信道", "B. 制造成本远低于 CWDM", "C. 只能使用无冷却激光器工作", "D. 传输距离通常局限在 100 米以内"], "answer": "A", "hint": "DWDM 密集波分复用波长间隔极窄，单纤容量极大，用于国家级骨干网", "explanation": "【官方考点与速通解析】\n- CWDM（稀疏/粗波分复用）：波长间隔较大（一般为 20 nm），复用信道数通常为 8~16 个，无需精密温控，成本低，适合城域接入网；\n- DWDM（密集波分复用）：波长间隔极小（0.8 nm 或 0.4 nm），单纤可并发传输 80~160 个波长通道，结合光纤放大器（EDFA）传输容量超大、距离超远，是长途骨干光纤通信的基石。选 A。"}, {"id": "p3_m32", "number": 32, "title": "在网络存储技术中，iSCSI（互联网小型计算机系统接口）之所以能够大幅降低集中存储网络部署成本，主要原因在于（ ）。", "options": ["A. 将 SCSI 块存储命令封装在标准的 TCP/IP 协议包中，可在通用以太网上运行", "B. 彻底放弃了所有硬盘介质，完全运行在内存中", "C. 仅支持单机本地存储，无法跨网络访问", "D. 不需要任何网卡与网线"], "answer": "A", "hint": "iSCSI 把 SCSI 存储指令放进普通 TCP/IP 传输，直接利用现有廉价以太网搭建 SAN", "explanation": "【官方考点与速通解析】\n传统的 FC-SAN（光纤通道存储区域网络）需要专门昂贵的光纤通道交换机、FC-HBA 专用光纤卡和光纤线缆。\niSCSI 协议打破了硬件专网限制，直接在应用层将 SCSI 块级指令封装成 TCP 报文，借由现有的廉价千兆/万兆以太网基础设施实现远距离高速块存储通信，大幅节约了企业建网成本。选 A。"}, {"id": "p3_m33", "number": 33, "title": "在配置 Cisco 交换机时，若希望清除交换机当前 Flash 中保存的 VLAN 数据库信息，应执行的操作是（ ）。", "options": ["A. delete flash:vlan.dat", "B. erase nvram", "C. clear vlan all", "D. shutdown vlan"], "answer": "A", "hint": "Cisco 交换机的 VLAN 配置独立保存在 Flash 介质中的 vlan.dat 文件中", "explanation": "【官方考点与速通解析】\nCisco Catalyst 交换机的特殊设计：\n普通的交换机接口与配置保存在 NVRAM 的 `startup-config` 中，执行 `erase startup-config` 即可清除；\n但是，交换机创建的所有 VLAN 数据库信息独立存放在 Flash 存储器根目录下的 `vlan.dat` 二进制文件中。因此要彻底恢复出厂交换机配置，必须同时执行 `delete flash:vlan.dat` 删除该文件。故选 A。"}, {"id": "p3_m34", "number": 34, "title": "在 Windows 邮件服务中，用户撰写的电子邮件在投递过程中经历的路由传递，在应用层完全依赖（ ）协议完成主机到主机的中转。", "options": ["A. SMTP", "B. POP3", "C. IMAP4", "D. HTTP"], "answer": "A", "hint": "邮件服务器之间的跨域邮件路由投递协议是 SMTP（端口 25）", "explanation": "【官方考点与速通解析】\n电子邮件全流程协议分工：\n1. 发件人客户端编写邮件 -> 发送给本域发信服务器：使用 SMTP 协议（端口 25）；\n2. 发信邮件服务器 -> 跨互联网路由查询对方 DNS MX 记录 -> 投递给接收方邮件服务器：仍然使用 SMTP 协议；\n3. 收件人客户端登录接收方邮件服务器查收下载邮件：使用 POP3（端口 110）或 IMAP4（端口 143）协议。故选 A。"}, {"id": "p3_m35", "number": 35, "title": "在构建容灾备份系统时，通常采用“两地三中心”工程架构。其中“两地三中心”是指（ ）。", "options": ["A. 同城生产中心、同城灾备中心、异地灾备中心", "B. 内网中心、外网中心、DMZ 中心", "C. 研发中心、测试中心、发布中心", "D. 华北中心、华东中心、华南中心"], "answer": "A", "hint": "两地三中心标准定义：同城双中心（生产+同城实时热备） + 异地灾备中心（防范区域性特大自然灾害）", "explanation": "【官方考点与速通解析】\n金融与电信行业顶级容灾“两地三中心”模型：\n- 第一地（本地）：包含“本地生产中心”和“同城灾备中心”（距离通常在几十公里内，通过高速光纤直连实现数据毫秒级同步镜像，保障设备故障快速接管）；\n- 第二地（异地）：设立“异地灾备中心”（距离数百公里以上，通过异步复制防范地震、洪涝等特大区域性毁灭灾害）。选 A。"}, {"id": "p3_m36", "number": 36, "title": "在网络协议分析中，ICMP 协议的数据报被直接封装在（ ）中进行传输。", "options": ["A. IP 数据报", "B. TCP 报文段", "C. UDP 用户数据报", "D. 物理层光脉冲"], "answer": "A", "hint": "ICMP 直接封装在 IP 报文里（IP 协议号为 1）", "explanation": "【官方考点与速通解析】\nICMP（网际控制报文协议）虽然在功能上协助网络层处理差错报告与探测，但从封装结构来看，ICMP 报文并不经过 TCP 或 UDP，而是直接装入 IP 数据报的有效数据载荷中，IP 报头的“协议（Protocol）”字段数值为十六进制 0x01（十进制 1）。选 A。"}, {"id": "p3_m37", "number": 37, "title": "在局域网综合布线系统中，连接两个不同建筑物之间计算机网络的大楼间外部光缆干线系统属于（ ）。", "options": ["A. 建筑群子系统", "B. 设备间子系统", "C. 干线（垂直）子系统", "D. 管理子系统"], "answer": "A", "hint": "跨越建筑物、大楼之间敷设的室外布线属于建筑群子系统", "explanation": "【官方考点与速通解析】\n综合布线子系统分类准则：\n- 同一栋大楼内连接楼层与机房的是“垂直干线子系统”；\n- 跨越不同建筑物之间、在园区室外管道或地下直埋敷设的通信光缆与保护装置属于“建筑群子系统（Campus Subsystem）”。故选 A。"}, {"id": "p3_m38", "number": 38, "title": "在计算机网络安全防范中，通过在内部核心服务器前部署 WAF（Web 应用防护系统），最擅长防御的攻击类型是（ ）。", "options": ["A. SQL 注入与 XSS 跨站脚本攻击", "B. 物理层光纤偷剪断线", "C. 交换机电源线松脱断电", "D. 客户端液晶显示器静电干扰"], "answer": "A", "hint": "WAF（Web Application Firewall）专注于应用层（HTTP/HTTPS）防护，专克 SQL 注入与 XSS", "explanation": "【官方考点与速通解析】\nWAF（Web 应用防火墙）工作在第七层应用层：\n它深度解析 HTTP 请求的 URL 参数、Cookie、POST Body，专门用于精准检测并阻断常见的 Web 应用漏洞攻击，例如 SQL 注入、跨站脚本（XSS）、命令注入、文件包含以及 Webshell 上传等。选 A。"}, {"id": "p3_m39", "number": 39, "title": "下列网络工具命令中，能够显示本地计算机当前活动的网络连接、监听的 TCP/UDP 端口号以及对应进程状态的是（ ）。", "options": ["A. netstat", "B. nslookup", "C. ping", "D. tracert"], "answer": "A", "hint": "netstat（Network Statistics）专门用于查看端口监听与 TCP 连接状态", "explanation": "【官方考点与速通解析】\n- netstat：显示网络连接、路由表、接口统计信息及监听端口（如 `netstat -ano`）；\n- nslookup：查询 DNS 域名解析记录；\n- ping：基于 ICMP 连通性测试；\n- tracert：路由路径跟踪。选 A。"}, {"id": "p3_m40", "number": 40, "title": "在 IPv6 协议中，每个标准 IPv6 全局单播地址的长度为（ ）。", "options": ["A. 32 位（4 字节）", "B. 64 位（8 字节）", "C. 128 位（16 字节）", "D. 256 位（32 字节）"], "answer": "C", "hint": "送分必拿题：IPv4 是 32 位，IPv6 是 128 位（16 字节）", "explanation": "【官方考点与速通解析】\nIPv4 地址长度为 32 位（4 字节）；IPv6 地址长度扩充到了 128 位（16 字节），被设计用来为地球上的每一粒沙子都分配一个独立的 IP 地址，彻底解决了地址耗尽问题。选 C。"}], "comprehensives": [{"id": "p3_c1", "number": 1, "score": 10, "title": "综合题一：IP 地址规划与 CIDR 掩码划分计算（10分）", "description": "某单位分配到的 IPv4 网络地址块为 192.168.100.200/22。请根据网络技术基础原理，完成下列各小题的数值计算：", "subquestions": [{"id": "p3_c1_1", "score": 2, "prompt": "【空 1】该地址块对应的子网掩码（点分十进制格式）为：", "placeholder": "例如: 255.255.xxx.xxx", "answer": ["255.255.252.0"], "hint": "/22 即第 3 字节高 6 位为 1（11111100 = 252）"}, {"id": "p3_c1_2", "score": 2, "prompt": "【空 2】该主机所在子网的网络地址为：", "placeholder": "例如: 192.168.xxx.0", "answer": ["192.168.100.0"], "hint": "100 与 252 按位与运算得 100"}, {"id": "p3_c1_3", "score": 2, "prompt": "【空 3】该子网的直接广播地址为：", "placeholder": "例如: 192.168.xxx.255", "answer": ["192.168.103.255"], "hint": "主机位共 10 位，第 3 字节块大小为 4，100 + 3 = 103"}, {"id": "p3_c1_4", "score": 2, "prompt": "【空 4】该子网可分配给主机的有效可用 IP 地址范围为（格式：起始IP~结束IP）：", "placeholder": "格式: 192.168.100.1~192.168.103.254", "answer": ["192.168.100.1~192.168.103.254", "192.168.100.1-192.168.103.254"], "hint": "网络地址 + 1 开始，广播地址 - 1 结束"}, {"id": "p3_c1_5", "score": 2, "prompt": "【空 5】该子网理论上最多允许容纳的有效可用主机数量为（填整数）：", "placeholder": "例如: 1022", "answer": ["1022"], "hint": "主机位数 n = 32 - 22 = 10，2^10 - 2 = 1024 - 2"}], "explanation": "【官方考点与解析】\n1. 子网掩码：/22 对应掩码中高 22 位为 1，第 3 字节为 11111100 = 252，点分十进制为 255.255.252.0；\n2. 网络地址：第 3 字节 100（01100100）与掩码 252（11111100）按位与得 01100100（100），网络地址为 192.168.100.0；\n3. 广播地址：块大小为 2^(32-22) = 1024 个 IP，第 3 字节跨越 4 个网段（100、101、102、103），广播地址为 192.168.103.255；\n4. 有效主机范围：192.168.100.1 ~ 192.168.103.254；\n5. 可用主机数：2^10 - 2 = 1024 - 2 = 1022 台。"}, {"id": "p3_c2", "number": 2, "score": 10, "title": "综合题二：路由器作为 DHCP 服务器配置命令分析（10分）", "description": "某企业出口路由器 Router-GW 同时担任局域网的 DHCP 服务器，负责为内网部门动态分配 IP 地址。内网网段为 192.168.1.0/24，默认网关为 192.168.1.1，DNS 服务器地址为 202.106.0.20，IP 租用期限设置为 8 天。同时需排除网关地址 192.168.1.1，防止 IP 地址冲突。\n\n请补全下列 Cisco 路由器的配置命令：", "code_snippet": "Router-GW# configure terminal\nRouter-GW(config)# ip dhcp 【空 1】 192.168.1.1\nRouter-GW(config)# ip dhcp pool OfficePool\nRouter-GW(dhcp-config)# network 192.168.1.0 【空 2】\nRouter-GW(dhcp-config)# default-router 【空 3】\nRouter-GW(dhcp-config)# dns-server 【空 4】\nRouter-GW(dhcp-config)# lease 【空 5】\nRouter-GW(dhcp-config)# exit", "subquestions": [{"id": "p3_c2_1", "score": 2, "prompt": "【空 1】配置排除保留 IP 地址（不参与动态分配）的命令关键字：", "placeholder": "例如: excluded-address", "answer": ["excluded-address"], "hint": "排除 IP 地址命令为 ip dhcp excluded-address"}, {"id": "p3_c2_2", "score": 2, "prompt": "【空 2】宣告动态分配网段对应的子网掩码（点分十进制）：", "placeholder": "例如: 255.255.255.0", "answer": ["255.255.255.0"], "hint": "/24 对应掩码 255.255.255.0"}, {"id": "p3_c2_3", "score": 2, "prompt": "【空 3】设置客户端默认网关 IP 地址：", "placeholder": "例如: 192.168.1.1", "answer": ["192.168.1.1"], "hint": "题干指定默认网关为 192.168.1.1"}, {"id": "p3_c2_4", "score": 2, "prompt": "【空 4】设置客户端首选 DNS 服务器 IP 地址：", "placeholder": "例如: 202.106.0.20", "answer": ["202.106.0.20"], "hint": "题干指定 DNS 为 202.106.0.20"}, {"id": "p3_c2_5", "score": 2, "prompt": "【空 5】设置租约期限（天数）：", "placeholder": "填数字", "answer": ["8"], "hint": "题干指定租期为 8 天"}], "explanation": "【官方考点与速通解析】\nCisco 路由器配置 DHCP 服务器的核心命令集：\n1. 排除地址：`ip dhcp excluded-address 192.168.1.1`（排除掉网关自身占用的 IP，防止被其他 PC 抢占冲突）；\n2. 创建地址池：`ip dhcp pool OfficePool`；\n3. 绑定网段与掩码：`network 192.168.1.0 255.255.255.0`；\n4. 分配默认网关：`default-router 192.168.1.1`；\n5. 分配 DNS 服务器：`dns-server 202.106.0.20`；\n6. 设置租期天数：`lease 8`（默认即为 8 天）。"}, {"id": "p3_c3", "number": 3, "score": 10, "title": "综合题三：IIS 网站发布与 DNS 解析配置（10分）", "description": "某大学计算中心在一台物理服务器上配置 IIS 搭建新闻发布网站（域名：news.univ.edu.cn）。服务器绑定的单网卡 IP 为 202.113.64.100，Web 默认端口为 80。网站代码存放在服务器 `D:\\WebRoot\\News` 目录下，网站默认起始文档为 `index.html`。\n\n请阅读并回答下列配置参数填空：", "subquestions": [{"id": "p3_c3_1", "score": 2, "prompt": "【空 1】在 IIS 站点基本设置中，该网站的“物理路径”应配置为：", "placeholder": "例如: D:\\WebRoot\\News", "answer": ["D:\\WebRoot\\News", "D:/WebRoot/News"], "hint": "题干给出的目录为 D:\\WebRoot\\News"}, {"id": "p3_c3_2", "score": 2, "prompt": "【空 2】在 IIS 绑定设置中，为使单 IP 运行多个站点，配置该站点的“主机名”（Host Name）应填写：", "placeholder": "例如: news.univ.edu.cn", "answer": ["news.univ.edu.cn"], "hint": "主机名即题干指定的完整域名 news.univ.edu.cn"}, {"id": "p3_c3_3", "score": 2, "prompt": "【空 3】在 IIS“默认文档”列表中，排在首位作为网站入口文件的文件名是：", "placeholder": "例如: index.html", "answer": ["index.html"], "hint": "题干说明默认起始文档为 index.html"}, {"id": "p3_c3_4", "score": 2, "prompt": "【空 4】在校内 DNS 服务器正向区域 univ.edu.cn 中，为 news 映射 202.113.64.100 所需创建的记录类型为：", "placeholder": "填 A记录 或 PTR", "answer": ["A记录", "A", "A 记录"], "hint": "正向域名解析映射 IPv4 地址使用 A 记录"}, {"id": "p3_c3_5", "score": 2, "prompt": "【空 5】若允许全网外来访客无需输入任何账号密码即可直接浏览该新闻网站，IIS 应启用的身份验证方式是：", "placeholder": "例如: 匿名身份验证", "answer": ["匿名身份验证", "匿名认证", "匿名"], "hint": "无需凭据公开访问对应匿名身份验证"}], "explanation": "【官方考点与速通解析】\n1. 空 1：物理路径指向网站文件的实际本地存储磁盘路径：`D:\\WebRoot\\News`；\n2. 空 2：单 IP、单 80 端口运行多个网站时，必须在站点绑定中指定“主机名”（主机头），此处填 `news.univ.edu.cn`；\n3. 空 3：默认文档指定网站首页文件，此处填 `index.html`；\n4. 空 4：DNS 正向区域将域名解析为主机 IPv4 地址的是 A 记录；\n5. 空 5：公开发布的新闻类网站通常启用“匿名身份验证”，系统自动使用内置的 IUSR 访客账户进行底层访问。"}, {"id": "p3_c4", "number": 4, "score": 10, "title": "综合题四：Wireshark 抓取 DNS 查询与 UDP 数据报分析（10分）", "description": "下图是通过 Wireshark 抓包工具捕获到的主机向本地 DNS 服务器发起域名解析请求的数据包解码信息：", "code_snippet": "Frame 1: 74 bytes on wire\nInternet Protocol Version 4, Src: 192.168.1.100, Dst: 202.113.64.3\nUser Datagram Protocol, Src Port: 54321, Dst Port: 53, Len: 40\n    Source Port: 54321\n    Destination Port: 53\n    Length: 40\n    Checksum: 0x7a3f [correct]\nDomain Name System (query)\n    Transaction ID: 0x1a2b\n    Flags: 0x0100 Standard query\n        0... .... .... .... = Response: Message is a query (0)\n        .000 0... .... .... = Opcode: Standard query (0)\n        .... ..1. .... .... = Recursion desired: Do query recursively (1)\n    Questions: 1\n    Answer RRs: 0\n    Queries\n        www.test.edu.cn: type A, class IN", "subquestions": [{"id": "p3_c4_1", "score": 2, "prompt": "【空 1】该 DNS 查询数据报在传输层所采用的传输层协议是（填 TCP 或 UDP）：", "placeholder": "填 TCP 或 UDP", "answer": ["UDP"], "hint": "看 User Datagram Protocol，DNS 日常查询基于 UDP"}, {"id": "p3_c4_2", "score": 2, "prompt": "【空 2】DNS 服务器提供解析服务的公认标准目标端口号为（填数字）：", "placeholder": "例如: 53", "answer": ["53"], "hint": "Dst Port: 53"}, {"id": "p3_c4_3", "score": 2, "prompt": "【空 3】该数据报目的 IP 地址 202.113.64.3 对应的网络设备角色是（填 DNS服务器 或 Web服务器）：", "placeholder": "填 DNS服务器 或 Web服务器", "answer": ["DNS服务器", "域名服务器", "DNS"], "hint": "接收 53 端口查询请求的服务器为 DNS 服务器"}, {"id": "p3_c4_4", "score": 2, "prompt": "【空 4】客户端当前正在请求查询的目标主机域名是：", "placeholder": "例如: www.test.edu.cn", "answer": ["www.test.edu.cn"], "hint": "看 Queries 下查询的域名 www.test.edu.cn"}, {"id": "p3_c4_5", "score": 2, "prompt": "【空 5】Flags 中 Recursion desired 置 1，表明客户端要求 DNS 服务器进行何种查询（填 递归查询 或 迭代查询）：", "placeholder": "填 递归查询 或 迭代查询", "answer": ["递归查询"], "hint": "Recursion desired 表示期望递归查询"}], "explanation": "【官方考点与速通解析】\n1. 空 1：DNS 解析查询默认采用 UDP 协议进行传输（只有当区域传送或报文长度超过 512 字节时才启用 TCP）；\n2. 空 2：DNS 服务标准周知端口号为 53；\n3. 空 3：目的 IP 202.113.64.3 监听在 53 端口，是客户端配置的本地 DNS 服务器；\n4. 空 4：根据 Queries 字段，解析请求域名为 `www.test.edu.cn`；\n5. 空 5：DNS 查询模式：\n   - 递归查询（Recursive Query）：客户端要求本地 DNS 服务器“负责到底”，若本地没有缓存，由 DNS 服务器代替客户端向根域、顶级域递归询问并最终直接返回 IP；\n   - 迭代查询（Iterative Query）：DNS 服务器只返回下一级权威服务器的地址，由询问者自行去下一级服务器询问。"}], "applied": {"id": "p3_app1", "number": 1, "score": 20, "title": "应用题：多分支机构广域网互联拓扑路由汇聚与可变长子网划分（20分）", "description": "某集团全国广域网骨干拓扑结构如下图所示。总部核心路由器 R-HQ 通过两条高速串行线路 S0 和 S1 分别连接华北区分中心路由器 R-NC 和华东区分中心路由器 R-EC。\n\n【拓扑参数与网段规划】\n1. R-HQ 到 R-NC 点对点直连链路包含 IP：172.16.0.1 和 172.16.0.2（掩码 /30）；\n2. R-HQ 到 R-EC 点对点直连链路包含 IP：172.16.0.5 和 172.16.0.6（掩码 /30）；\n3. R-NC 下辖 4 个连续部门网段：172.16.4.0/24、172.16.5.0/24、172.16.6.0/24、172.16.7.0/24；\n4. R-EC 下辖 4 个连续部门网段：172.16.8.0/24、172.16.9.0/24、172.16.10.0/24、172.16.11.0/24；\n5. R-NC 经 S0 接口汇聚通告至 R-HQ；R-EC 经 S1 接口汇聚通告至 R-HQ。", "svg_diagram": "<svg viewBox=\"0 0 760 360\" width=\"100%\" height=\"300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <linearGradient id=\"gRouter3\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#059669\"/>\n      <stop offset=\"100%\" stop-color=\"#047857\"/>\n    </linearGradient>\n    <linearGradient id=\"gSwitch3\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#d97706\"/>\n      <stop offset=\"100%\" stop-color=\"#b45309\"/>\n    </linearGradient>\n  </defs>\n  <rect width=\"100%\" height=\"100%\" fill=\"#fcfcfc\" rx=\"12\"/>\n  <text x=\"380\" y=\"30\" font-size=\"16\" font-weight=\"bold\" fill=\"#1e293b\" text-anchor=\"middle\">集团总部与区域分中心骨干路由拓扑</text>\n  \n  <!-- Core Router R-HQ -->\n  <circle cx=\"380\" cy=\"75\" r=\"28\" fill=\"url(#gRouter3)\" stroke=\"#065f46\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"80\" font-size=\"13\" font-weight=\"bold\" fill=\"#ffffff\" text-anchor=\"middle\">R-HQ</text>\n  <text x=\"380\" y=\"118\" font-size=\"11\" fill=\"#475569\" text-anchor=\"middle\">总部核心 (R-HQ)</text>\n\n  <!-- Links -->\n  <line x1=\"355\" y1=\"90\" x2=\"210\" y2=\"16 ore": 3, "prompt": "【空 1】R-HQ 到 R-NC 的直连点对点链路（172.16.0.1 和 172.16.0.2）聚合后的网络地址及掩码长度为：", "placeholder": "例如: 172.16.0.0/30", "answer": ["172.16.0.0/30"], "hint": "块大小为 4，网络地址 172.16.0.0/30"}, {"id": "p3_app1_2", "score": 3, "prompt": "【空 2】R-HQ 到 R-EC 的直连点对点链路（172.16.0.5 和 172.16.0.6）聚合后的网络地址及掩码长度为：", "placeholder": "例如: 172.16.0.4/30", "answer": ["172.16.0.4/30"], "hint": "块大小为 4，网络地址 172.16.0.4/30"}, {"id": "p3_app1_3", "score": 3, "prompt": "【空 3】华北区分中心 4 个网段（172.16.4.0/24 ~ 172.16.7.0/24）汇聚后的超网路由条目为：", "placeholder": "例如: 172.16.4.0/22", "answer": ["172.16.4.0/22"], "hint": "4、5、6、7 连续 4 个 /24 聚合为 /22"}, {"id": "p3_app1_4", "score": 3, "prompt": "【空 4】华东区分中心 4 个网段（172.16.8.0/24 ~ 172.16.11.0/24）汇聚后的超网路由条目为：", "placeholder": "例如: 172.16.8.0/22", "answer": ["172.16.8.0/22"], "hint": "8、9、10、11 连续 4 个 /24 聚合为 /22"}, {"id": "p3_app1_5", "score": 2, "prompt": "【空 5】若在 R-HQ 出口部署一台能够对员工外发邮件及文件传输进行合规审计与防泄密的网络安全设备，该设备统称为（填 DLP 或 WAF）：", "placeholder": "填 DLP 或 WAF", "answer": ["DLP"], "hint": "数据防泄露系统 DLP（Data Loss Prevention）"}, {"id": "p3_app1_6", "score": 6, "prompt": "【空 6】现将地址块 10.1.1.0/24 划分子网供三个分支机构使用：分支 A（需 60 台主机）、分支 B（需 28 台主机）、分支 C（需 12 台主机）。请写出【分支 A】和【分支 B】划分后的子网掩码：", "placeholder": "格式: 分支A:255.255.255.192; 分支B:255.255.255.224", "answer": ["分支A:255.255.255.192; 分支B:255.255.255.224", "255.255.255.192 255.255.255.224", "255.255.255.192, 255.255.255.224"], "hint": "60 台需 2^6=64（/26，掩码 255.255.255.192）；28 台需 2^5=32（/27，掩码 255.255.255.224）"}], "explanation": "【官方考点与解析】\n1. 点对点链路计算：\n   - .1 和 .2 属于 172.16.0.0/30（可用 .1~.2，广播 .3）；\n   - .5 和 .6 属于 172.16.0.4/30（可用 .5~.6，广播 .7）；\n2. 路由汇聚聚合：\n   - 华北 4、5、6、7：第 3 字节前 6 位均为 000001，掩码缩短 2 位变为 /22，聚合为 172.16.4.0/22；\n   - 华东 8、9、10、11：第 3 字节前 6 位均为 000010，聚合为 172.16.8.0/22；\n3. 安全设备：DLP（数据泄露防护系统，负责敏感内容识别与外发阻断审计）；\n4. VLSM 划分计算：\n   - 分支 A（60 台主机）：主机位需 6 位（2^6 - 2 = 62 > 60），掩码前缀 = 32 - 6 = 26 位。掩码：255.255.255.192，网段：10.1.1.0/26，可用 IP：10.1.1.1 ~ 10.1.1.62；\n   - 分支 B（28 台主机）：主机位需 5 位（2^5 - 2 = 30 > 28），掩码前缀 = 32 - 5 = 27 位。掩码：255.255.255.224，网段：10.1.1.64/27，可用 IP：10.1.1.65 ~ 10.1.1.94。"}}];

      const intro = document.getElementById('paperIntro');
      intro.innerHTML = `
        <h1>${paper.title}</h1>
        <p>${paper.subtitle}</p>
        <div class="stats-bar">
          <div class="stat-pill">⏱️ 考试时长: <strong>120 分钟</strong></div>
          <div class="stat-pill">💯 试卷总分: <strong>${paper.total_score} 分</strong></div>
          <div class="stat-pill">🎯 合格线: <strong>60 分</strong></div>
          <div class="stat-pill">📚 单选题 40分 | 综合题 40分 | 应用题 20分</div>
        </div>
      `;
    }

    // Render Questions
    function renderQuestions() {
      const paper = papersData[currentPaperIndex];
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      // Section 1: MCQs
      const sec1Title = document.createElement('div');
      sec1Title.className = 'section-title';
      sec1Title.textContent = `第一部分：单项选择题（共 40 题，每题 1 分，共 40 分）`;
      container.appendChild(sec1Title);

      paper.mcqs.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${q.id}`;

        const isMarked = markedQuestions.has(q.id);
        const userAns = getUserAnswer(q.id);

        let optionsHtml = '<div class="options-list">';
        q.options.forEach((opt) => {
          const letter = opt.trim().charAt(0);
          let cls = 'option-item';
          if (userAns === letter) cls += ' selected';

          if (isSubmitted || isStudyMode) {
            if (userAns) {
              if (letter === q.answer) cls += ' correct';
              else if (userAns === letter) cls += ' wrong';
            }
          }

          optionsHtml += `
            <div class="${cls}" onclick="selectOption('${q.id}', '${letter}')">
              ${opt}
            </div>
          `;
        });
        optionsHtml += '</div>';

        card.innerHTML = `
          <div class="question-header">
            <span class="q-number">第 ${q.number} 题</span>
            <div class="q-title">${q.title}</div>
            <button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="toggleMark('${q.id}')">
              ${isMarked ? '★ 已标记' : '☆ 标记'}
            </button>
          </div>
          ${optionsHtml}
          <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${q.id}">
            <div class="exp-title">💡 官方考点与速通解析 【标准答案: ${q.answer}】</div>
            <div class="exp-content">${q.explanation}</div>
          </div>
        `;
        container.appendChild(card);
      });

      // Section 2: Comprehensives
      const sec2Title = document.createElement('div');
      sec2Title.className = 'section-title';
      sec2Title.textContent = `第二部分：综合题（共 4 大题，每题 10 分，共 40 分）`;
      container.appendChild(sec2Title);

      paper.comprehensives.forEach((comp) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${comp.id}`;

        let codeHtml = comp.code_snippet ? `<div class="code-box">${escapeHtml(comp.code_snippet)}</div>` : '';

        let subqsHtml = '';
        comp.subquestions.forEach((sq) => {
          const userVal = getUserAnswer(sq.id) || '';
          let inputClass = 'blank-input';
          if (isSubmitted || isStudyMode) {
            if (userVal.trim()) {
              if (checkBlankAnswer(userVal, sq.answer)) inputClass += ' correct';
              else inputClass += ' wrong';
            }
          }

          subqsHtml += `
            <div class="blank-group">
              <div class="blank-label">${sq.prompt} <span style="color:var(--primary); font-size:0.8rem;">(${sq.score}分)</span></div>
              <div class="blank-input-row">
                <input type="text" class="${inputClass}" id="input_${sq.id}" 
                  placeholder="${sq.placeholder}" value="${escapeHtml(userVal)}"
                  onchange="saveBlankAnswer('${sq.id}', this.value)"
                  onblur="saveBlankAnswer('${sq.id}', this.value)">
                ${isStudyMode ? `<button class="btn btn-outline" style="padding:4px 8px;font-size:0.75rem;" onclick="showBlankHint('${sq.id}', '${sq.hint}')">提示</button>` : ''}
              </div>
              ${(isSubmitted || isStudyMode) ? `<div style="margin-top:6px; font-size:0.8rem; color:var(--text-muted);">【标准参考】${sq.answer.join(' 或 ')} | 提示: ${sq.hint}</div>` : ''}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <span class="q-number">综合题 ${comp.number}</span>
            <div class="q-title">${comp.title}</div>
          </div>
          <p style="font-size:0.95rem; color:var(--text); margin-bottom:10px;">${comp.description}</p>
          ${codeHtml}
          ${subqsHtml}
          <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${comp.id}">
            <div class="exp-title">💡 综合题精讲与解题推导</div>
            <div class="exp-content">${comp.explanation}</div>
          </div>
        `;
        container.appendChild(card);
      });

      // Section 3: Applied Question
      const sec3Title = document.createElement('div');
      sec3Title.className = 'section-title';
      sec3Title.textContent = `第三部分：应用题（共 1 大题，共 20 分）`;
      container.appendChild(sec3Title);

      const app = paper.applied;
      const appCard = document.createElement('div');
      appCard.className = 'question-card';
      appCard.id = `card_${app.id}`;

      let svgHtml = app.svg_diagram ? `<div style="margin:16px 0; border-radius:8px; overflow:hidden; border:1px solid var(--border);">${app.svg_diagram}</div>` : '';

      let appSubsHtml = '';
      app.subquestions.forEach((sq) => {
        const userVal = getUserAnswer(sq.id) || '';
        let inputClass = 'blank-input';
        if (isSubmitted || isStudyMode) {
          if (userVal.trim()) {
            if (checkBlankAnswer(userVal, sq.answer)) inputClass += ' correct';
            else inputClass += ' wrong';
          }
        }

        appSubsHtml += `
          <div class="blank-group">
            <div class="blank-label">${sq.prompt} <span style="color:var(--primary); font-size:0.8rem;">(${sq.score}分)</span></div>
            <div class="blank-input-row">
              <input type="text" class="${inputClass}" id="input_${sq.id}" 
                placeholder="${sq.placeholder}" value="${escapeHtml(userVal)}"
                onchange="saveBlankAnswer('${sq.id}', this.value)"
                onblur="saveBlankAnswer('${sq.id}', this.value)">
              ${isStudyMode ? `<button class="btn btn-outline" style="padding:4px 8px;font-size:0.75rem;" onclick="showBlankHint('${sq.id}', '${sq.hint}')">提示</button>` : ''}
            </div>
            ${(isSubmitted || isStudyMode) ? `<div style="margin-top:6px; font-size:0.8rem; color:var(--text-muted);">【标准参考】${sq.answer.join(' 或 ')} | 提示: ${sq.hint}</div>` : ''}
          </div>
        `;
      });

      appCard.innerHTML = `
        <div class="question-header">
          <span class="q-number">应用题</span>
          <div class="q-title">${app.title}</div>
        </div>
        <p style="font-size:0.95rem; color:var(--text);">${app.description}</p>
        ${svgHtml}
        ${appSubsHtml}
        <div class="explanation-box ${isSubmitted || isStudyMode ? 'show' : ''}" id="exp_${app.id}">
          <div class="exp-title">💡 拓扑规划与综合应用大题解析</div>
          <div class="exp-content">${app.explanation}</div>
        </div>
      `;
      container.appendChild(appCard);
    }

    // Palette Render
    function renderPalette() {
      const paper = papersData[currentPaperIndex];
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';

      let totalCount = 0;
      let answeredCount = 0;

      // 40 MCQs
      paper.mcqs.forEach((q) => {
        totalCount++;
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = q.number;
        btn.id = `pal_${q.id}`;

        const ans = getUserAnswer(q.id);
        if (ans) {
          answeredCount++;
          btn.classList.add('done');
        }
        if (markedQuestions.has(q.id)) {
          btn.classList.add('marked');
        }

        if (isSubmitted) {
          if (ans === q.answer) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('wrong');
          }
        }

        btn.onclick = () => scrollToCard(`card_${q.id}`);
        grid.appendChild(btn);
      });

      // 4 Comprehensive Big Questions
      paper.comprehensives.forEach((c) => {
        totalCount++;
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = `综${c.number}`;
        btn.id = `pal_${c.id}`;

        let done = c.subquestions.every(sq => !!getUserAnswer(sq.id));
        if (done) {
          answeredCount++;
          btn.classList.add('done');
        }
        btn.onclick = () => scrollToCard(`card_${c.id}`);
        grid.appendChild(btn);
      });

      // 1 Applied Big Question
      totalCount++;
      const appBtn = document.createElement('button');
      appBtn.className = 'palette-btn';
      appBtn.textContent = '应';
      appBtn.id = `pal_${paper.applied.id}`;
      if (paper.applied.subquestions.every(sq => !!getUserAnswer(sq.id))) {
        answeredCount++;
        appBtn.classList.add('done');
      }
      appBtn.onclick = () => scrollToCard(`card_${paper.applied.id}`);
      grid.appendChild(appBtn);

      document.getElementById('progressText').textContent = `${answeredCount} / ${totalCount}`;
    }

    // State Management
    function getUserAnswer(qId) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      return userAnswers[paperId][qId];
    }

    function selectOption(qId, letter) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      userAnswers[paperId][qId] = letter;
      renderQuestions();
      renderPalette();
    }

    function saveBlankAnswer(qId, val) {
      const paperId = papersData[currentPaperIndex].id;
      if (!userAnswers[paperId]) userAnswers[paperId] = {};
      userAnswers[paperId][qId] = val.trim();
      renderPalette();
    }

    function toggleMark(qId) {
      if (markedQuestions.has(qId)) markedQuestions.delete(qId);
      else markedQuestions.add(qId);
      renderQuestions();
      renderPalette();
    }

    function showBlankHint(qId, hint) {
      alert(`💡 考点提示：${hint}`);
    }

    function scrollToCard(cardId) {
      const el = document.getElementById(cardId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Fuzzy matching for blank text questions
    function checkBlankAnswer(userInput, correctList) {
      if (!userInput) return false;
      const cleanUser = userInput.trim().toLowerCase().replace(/\s+/g, '');
      return correctList.some(target => {
        const cleanTarget = target.trim().toLowerCase().replace(/\s+/g, '');
        return cleanUser === cleanTarget;
      });
    }

    // Submit Exam
    function submitExam() {
      isSubmitted = true;
      const paper = papersData[currentPaperIndex];

      let mcqScore = 0;
      let compScore = 0;
      let appScore = 0;
      const wrongList = [];

      // 1. Calculate MCQs
      paper.mcqs.forEach((q) => {
        const ans = getUserAnswer(q.id);
        if (ans === q.answer) {
          mcqScore += 1;
        } else {
          wrongList.push(`第 ${q.number} 题（单选题）：考生选 ${ans || '未作答'}，标准答案 ${q.answer}`);
        }
      });

      // 2. Calculate Comprehensive Questions
      paper.comprehensives.forEach((c) => {
        c.subquestions.forEach((sq) => {
          const ans = getUserAnswer(sq.id);
          if (checkBlankAnswer(ans, sq.answer)) {
            compScore += sq.score;
          } else {
            wrongList.push(`综合题 ${c.number} - ${sq.prompt}：考生填“${ans || '未填'}”，参考：“${sq.answer[0]}”`);
          }
        });
      });

      // 3. Calculate Applied Questions
      paper.applied.subquestions.forEach((sq) => {
        const ans = getUserAnswer(sq.id);
        if (checkBlankAnswer(ans, sq.answer)) {
          appScore += sq.score;
        } else {
          wrongList.push(`应用题 - ${sq.prompt}：考生填“${ans || '未填'}”，参考：“${sq.answer[0]}”`);
        }
      });

      const totalScore = mcqScore + compScore + appScore;

      // Update Modal
      document.getElementById('modalScore').textContent = totalScore;
      document.getElementById('mcqScoreReport').textContent = `${mcqScore} / 40`;
      document.getElementById('compScoreReport').textContent = `${compScore} / 40`;
      document.getElementById('appScoreReport').textContent = `${appScore} / 20`;

      const title = document.getElementById('modalResultTitle');
      const subtitle = document.getElementById('modalResultSubtitle');
      if (totalScore >= 60) {
        title.innerHTML = '🎉 恭喜！您已顺利通过本科目模拟考试！';
        title.style.color = 'var(--success)';
        subtitle.textContent = `全国计算机等级考试及格线为 60 分，您的表现非常优秀！`;
      } else {
        title.innerHTML = '⚠️ 暂未及格，仍需巩固知识点！';
        title.style.color = 'var(--danger)';
        subtitle.textContent = `距离 60 分合格线还差 ${60 - totalScore} 分，请仔细研读每题解析！`;
      }

      const wrongDiv = document.getElementById('wrongQuestionsList');
      if (wrongList.length === 0) {
        wrongDiv.innerHTML = '<div style="color:var(--success); font-weight:bold;">🔥 太厉害了！全卷满分零失误！</div>';
      } else {
        wrongDiv.innerHTML = wrongList.map(item => `<div style="padding:4px 0; border-bottom:1px dashed var(--border);">${item}</div>`).join('');
      }

      document.getElementById('scoreModal').classList.add('show');
      renderQuestions();
      renderPalette();
    }

    function closeModal() {
      document.getElementById('scoreModal').classList.remove('show');
    }

    function restartExam() {
      closeModal();
      resetCurrentPaper();
    }

    function resetCurrentPaper() {
      if (confirm('确认清空本套试卷的所有作答记录并重新作答吗？')) {
        const paperId = papersData[currentPaperIndex].id;
        userAnswers[paperId] = {};
        isSubmitted = false;
        renderQuestions();
        renderPalette();
        timeRemaining = 120 * 60;
      }
    }

    function toggleAllExplanations() {
      const boxes = document.querySelectorAll('.explanation-box');
      const anyHidden = Array.from(boxes).some(b => !b.classList.contains('show'));
      boxes.forEach(b => {
        if (anyHidden) b.classList.add('show');
        else b.classList.remove('show');
      });
    }

    // Timer
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isSubmitted && !isStudyMode) {
          timeRemaining--;
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert('⏰ 考试时间到！系统已为您自动交卷评分。');
            submitExam();
          }
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById('timerDisplay').textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Run on startup
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
