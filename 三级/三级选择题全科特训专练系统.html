标文件更新的依赖文件列表。"}, {"id": 44, "category": "Makefile工程构建", "question": "在 Makefile 中，声明伪目标 `.PHONY: clean` 的主要目的是（ ）。", "options": ["A. 防止当前目录下恰好存在名为 clean 的同名文件时导致 clean 规则失效不被执行", "B. 强制清理磁盘上所有以 .o 结尾的文件", "C. 允许 Makefile 并发多线程编译", "D. 提升 GCC 编译器的优化级别"], "answer": "A", "analysis": "【官方考点解析】选 A。Make 判断目标是否需要重新执行是依据目标文件的时间戳。如果目录下恰好有一个名为 `clean` 的普通文件，且该文件时间较新，那么在执行 `make clean` 时，Make 会认为目标文件已是最新从而拒绝执行清理命令。声明 `.PHONY: clean` 后，Make 将不再检查同名文件，无论如何都会无条件执行其下的清理命令。"}, {"id": 45, "category": "系统调用与多线程网络", "question": "Linux 系统为每个进程默认打开三个标准文件描述符。其中标准输入、标准输出和标准错误对应的整型描述符分别是（ ）。", "options": ["A. 0、1、2", "B. 1、2、3", "C. 0、2、1", "D. -1、0、1"], "answer": "A", "analysis": "【官方考点解析】选 A。POSIX 文件描述符（File Descriptor）标准：\n- 0：`STDIN_FILENO`，标准输入；\n- 1：`STDOUT_FILENO`，标准输出；\n- 2：`STDERR_FILENO`，标准错误输出；后续应用程序新调 `open()` 分配的描述符将从当前最小未使用的整数（通常为 3）开始分配。"}, {"id": 46, "category": "GCC编译与优化", "question": "在使用 POSIX 线程库（pthread）进行多线程开发时，在 GCC 编译命令末尾必须链接的动态线程库参数是（ ）。", "options": ["A. -lpthread", "B. -lthread", "C. -posix", "D. -lm"], "answer": "A", "analysis": "【官方考点解析】选 A。在 Linux 环境下使用 `<pthread.h>` 编写多线程代码时，线程函数实现位于 `libpthread.so` 动态库中，GCC 编译命令行末尾必须显式加上链接参数 `-lpthread`（或现代 GCC 参数 `-pthread`）。"}, {"id": 47, "category": "C语言开发与系统调用", "question": "在 Linux 套接字网络编程中，TCP 服务端程序建立监听连接的标准系统调用函数调用顺序是（ ）。", "options": ["A. socket() ➔ bind() ➔ listen() ➔ accept()", "B. socket() ➔ listen() ➔ bind() ➔ accept()", "C. socket() ➔ connect() ➔ bind() ➔ listen()", "D. bind() ➔ socket() ➔ listen() ➔ accept()"], "answer": "A", "analysis": "【官方考点解析】选 A。TCP 服务端编程标准时序：\n1. `socket()`：创建网络通信套接字；\n2. `bind()`：将套接字与本机的 IP 地址和端口绑定；\n3. `listen()`：设置等待连接队列长度，使套接字进入被动监听状态；\n4. `accept()`：阻塞等待客户端三次握手完成，并返回一个全新的已连接套接字用于后续通信。"}, {"id": 48, "category": "Web服务与应用部署", "question": "在 Nginx Web 服务器的主配置文件 `nginx.conf` 中，用于将接收到的客户端 HTTP 请求透明反向代理转发至后端应用服务器的配置指令是（ ）。", "options": ["A. proxy_pass http://127.0.0.1:8080;", "B. forward http://127.0.0.1:8080;", "C. redirect http://127.0.0.1:8080;", "D. upstream_connect http://127.0.0.1:8080;"], "answer": "A", "analysis": "【官方考点解析】选 A。Nginx 反向代理配置典型范例：\n```nginx\nlocation /api/ {\n    proxy_pass http://127.0.0.1:8080;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n}\n```\n其中 `proxy_pass` 是定义后端真实应用服务器地址（或 upstream 集群名）的标准配置指令。"}, {"id": 49, "category": "C语言开发与系统调用", "question": "Linux 应用程序开发与部署综合题 11：在进行 Linux 系统级 C 编程与软件架构设计时，下列做法正确的是（ ）。", "options": ["A. 在父进程中通过 `wait()` 或 `waitpid()` 监听子进程退出，回收子进程资源以避免产生僵尸进程", "B. 在 Makefile 中所有依赖规则的命令行前使用空格进行缩进", "C. 多线程并发修改全局共享变量时不需要使用互斥锁（Mutex）进行同步保护", "D. 在调用 fork() 之前关闭所有标准文件描述符"], "answer": "A", "analysis": "【官方考点解析】选 A。开发规范考点：父进程负责调用 `wait()` 或 `waitpid()` 读取子进程的退出状态码并由内核释放子进程的 PCB，防止子进程沦为僵尸进程（Zombie）。"}, {"id": 50, "category": "C语言开发与系统调用", "question": "Linux 应用程序开发与部署综合题 12：在进行 Linux 系统级 C 编程与软件架构设计时，下列做法正确的是（ ）。", "options": ["A. 在父进程中通过 `wait()` 或 `waitpid()` 监听子进程退出，回收子进程资源以避免产生僵尸进程", "B. 在 Makefile 中所有依赖规则的命令行前使用空格进行缩进", "C. 多线程并发修改全局共享变量时不需要使用互斥锁（Mutex）进行同步保护", "D. 在调用 fork() 之前关闭所有标准文件描述符"], "answer": "A", "analysis": "【官方考点解析】选 A。开发规范考点：父进程负责调用 `wait()` 或 `waitpid()` 读取子进程的退出状态码并由内核释放子进程的 PCB，防止子进程沦为僵尸进程（Zombie）。"}, {"id": 51, "category": "C语言开发与系统调用", "question": "Linux 应用程序开发与部署综合题 13：在进行 Linux 系统级 C 编程与软件架构设计时，下列做法正确的是（ ）。", "options": ["A. 在父进程中通过 `wait()` 或 `waitpid()` 监听子进程退出，回收子进程资源以避免产生僵尸进程", "B. 在 Makefile 中所有依赖规则的命令行前使用空格进行缩进", "C. 多线程并发修改全局共享变量时不需要使用互斥锁（Mutex）进行同步保护", "D. 在调用 fork() 之前关闭所有标准文件描述符"], "answer": "A", "analysis": "【官方考点解析】选 A。开发规范考点：父进程负责调用 `wait()` 或 `waitpid()` 读取子进程的退出状态码并由内核释放子进程的 PCB，防止子进程沦为僵尸进程（Zombie）。"}, {"id": 52, "category": "C语言开发与系统调用", "question": "Linux 应用程序开发与部署综合题 14：在进行 Linux 系统级 C 编程与软件架构设计时，下列做法正确的是（ ）。", "options": ["A. 在父进程中通过 `wait()` 或 `waitpid()` 监听子进程退出，回收子进程资源以避免产生僵尸进程", "B. 在 Makefile 中所有依赖规则的命令行前使用空格进行缩进", "C. 多线程并发修改全局共享变量时不需要使用互斥锁（Mutex）进行同步保护", "D. 在调用 fork() 之前关闭所有标准文件描述符"], "answer": "A", "analysis": "【官方考点解析】选 A。开发规范考点：父进程负责调用 `wait()` 或 `waitpid()` 读取子进程的退出状态码并由内核释放子进程的 PCB，防止子进程沦为僵尸进程（Zombie）。"}, {"id": 53, "category": "C语言开发与系统调用", "question": "Linux 应用程序开发与部署综合题 15：在进行 Linux 系统级 C 编程与软件架构设计时，下列做法正确的是（ ）。", "options": ["A. 在父进程中通过 `wait()` 或 `waitpid()` 监听子进程退出，回收子进程资源以避免产生僵尸进程", "B. 在 Makefile 中所有依赖规则的命令行前使用空格进行缩进", "C. 多线程并发修改全局共享变量时不需要使用互斥锁（Mutex）进行同步保护", "D. 在调用 fork() 之前关闭所有标准文件描述符"], "answer": "A", "analysis": "【官方考点解析】选 A。开发规范考点：父进程负责调用 `wait()` 或 `waitpid()` 读取子进程的退出状态码并由内核释放子进程的 PCB，防止子进程沦为僵尸进程（Zombie）。"}];

    let currentSubject = 'net';
    let currentMode = 'practice';
    let selectedCategory = 'ALL';
    let searchQuery = '';
    let currentIndex = 0;
    let filteredQuestions = [];
    let userAnswers = {};
    let flags = {};
    let wrongBook = JSON.parse(localStorage.getItem('ncre_wrong_book') || '{"net":[], "db":[], "linux":[]}');
    let timerInterval = null;
    let timeLeft = 2400; // 40 minutes

    function init() {
      loadSubject('net');
      updateWrongCount();
    }

    function getRawQuestions() {
      if (currentSubject === 'net') return NET_QUESTIONS;
      if (currentSubject === 'db') return DB_QUESTIONS;
      return LINUX_QUESTIONS;
    }

    function loadSubject(subj) {
      currentSubject = subj;
      document.getElementById('tabNet').classList.toggle('active', subj === 'net');
      document.getElementById('tabDb').classList.toggle('active', subj === 'db');
      document.getElementById('tabLinux').classList.toggle('active', subj === 'linux');
      
      selectedCategory = 'ALL';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      
      renderCategoryBar();
      applyFilters();
    }

    function switchSubject(subj) {
      if (subj === currentSubject) return;
      loadSubject(subj);
    }

    function renderCategoryBar() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';

      const raw = getRawQuestions();
      const categories = ['ALL', ...new Set(raw.map(q => q.category))];

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (cat === selectedCategory ? ' active' : '');
        btn.innerText = (cat === 'ALL') ? '全部考点 (' + raw.length + ')' : cat;
        btn.onclick = () => {
          selectedCategory = cat;
          renderCategoryBar();
          applyFilters();
        };
        bar.appendChild(btn);
      });
    }

    function applyFilters() {
      const raw = getRawQuestions();
      let list = [...raw];

      // Wrong book mode
      if (currentMode === 'wrong') {
        const wrongIds = new Set(wrongBook[currentSubject] || []);
        list = list.filter(q => wrongIds.has(q.id));
        if (list.length === 0) {
          alert("🎉 当前科目暂无错题！已自动切换回即答即评模式。");
          setMode('practice');
          return;
        }
      }
      // Exam mode: random 40
      else if (currentMode === 'exam') {
        list = shuffleArray([...raw]).slice(0, 40);
      }

      // Category filter
      if (selectedCategory !== 'ALL' && currentMode !== 'exam') {
        list = list.filter(q => q.category === selectedCategory);
      }

      // Search filter
      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase();
        list = list.filter(item => 
          item.question.toLowerCase().includes(q) || 
          item.options.some(opt => opt.toLowerCase().includes(q)) ||
          item.analysis.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q)
        );
      }

      filteredQuestions = list;
      currentIndex = 0;
      userAnswers = {};

      if (filteredQuestions.length === 0) {
        document.getElementById('qTitle').innerText = "未找到符合条件的考点试题，请重置搜索或选择“全部考点”。";
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('analysisBox').classList.remove('show');
        document.getElementById('progressSummary').innerText = `0/0`;
        return;
      }

      renderQuestion();
      renderPalette();
      updateProgress();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
      document.getElementById('modeWrong').classList.toggle('active', mode === 'wrong');

      const timerEl = document.getElementById('timerDisplay');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'exam') {
        timerEl.style.display = 'block';
        submitBtn.style.display = 'block';
        startTimer();
      } else {
        timerEl.style.display = 'none';
        submitBtn.style.display = 'none';
        clearInterval(timerInterval);
      }

      applyFilters();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 2400; // 40 mins
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("考试时间到，系统已自动交卷！");
          submitExam();
        }
        updateTimerUI();
      }, 1000);
    }

    function updateTimerUI() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timerDisplay').innerText = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderQuestion() {
      if (!filteredQuestions || filteredQuestions.length === 0) return;
      const q = filteredQuestions[currentIndex];

      document.getElementById('qCategory').innerText = `[${currentIndex + 1}/${filteredQuestions.length}] ${q.category}`;
      document.getElementById('qTitle').innerText = `${currentIndex + 1}. ${q.question}`;
      
      const flagBtn = document.getElementById('qFlagBtn');
      flagBtn.classList.toggle('flagged', !!flags[q.id]);

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const selected = userAnswers[q.id];
      const showAnswer = (currentMode === 'practice' && selected) || (currentMode === 'wrong' && selected);

      q.options.forEach(opt => {
        const letter = opt.charAt(0);
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerText = opt;

        if (selected === letter) {
          div.classList.add('selected');
        }

        if (showAnswer) {
          if (letter === q.answer) {
            div.classList.add('correct');
          } else if (selected === letter && selected !== q.answer) {
            div.classList.add('wrong');
          }
        }

        div.onclick = () => selectOption(q.id, letter);
        container.appendChild(div);
      });

      const analysisBox = document.getElementById('analysisBox');
      if (showAnswer) {
        document.getElementById('ansCorrect').innerText = q.answer;
        document.getElementById('ansAnalysis').innerText = q.analysis;
        analysisBox.classList.add('show');
      } else {
        analysisBox.classList.remove('show');
      }

      renderPalette();
      updateProgress();
    }

    function selectOption(qId, letter) {
      userAnswers[qId] = letter;
      const q = filteredQuestions[currentIndex];

      if (letter !== q.answer) {
        if (!wrongBook[currentSubject].includes(qId)) {
          wrongBook[currentSubject].push(qId);
          saveWrongBook();
        }
      } else {
        if (currentMode === 'wrong') {
          wrongBook[currentSubject] = wrongBook[currentSubject].filter(id => id !== qId);
          saveWrongBook();
        }
      }

      renderQuestion();
    }

    function saveWrongBook() {
      localStorage.setItem('ncre_wrong_book', JSON.stringify(wrongBook));
      updateWrongCount();
    }

    function updateWrongCount() {
      const count = (wrongBook[currentSubject] || []).length;
      document.getElementById('wrongCount').innerText = count;
    }

    function toggleFlag() {
      const q = filteredQuestions[currentIndex];
      flags[q.id] = !flags[q.id];
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < filteredQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function jumpTo(idx) {
      currentIndex = idx;
      renderQuestion();
      closeDrawer();
    }

    function openDrawer() {
      document.getElementById('drawerOverlay').classList.add('active');
      document.getElementById('paletteDrawer').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('active');
      document.getElementById('paletteDrawer').classList.remove('active');
    }

    function renderPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';
      filteredQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.innerText = idx + 1;
        if (idx === currentIndex) btn.classList.add('active');
        
        const ans = userAnswers[q.id];
        if (ans) {
          if (currentMode === 'exam') {
            btn.classList.add('answered');
          } else {
            if (ans === q.answer) {
              btn.classList.add('correct');
            } else {
              btn.classList.add('wrong');
            }
          }
        }

        if (flags[q.id]) btn.classList.add('flagged');

        btn.onclick = () => jumpTo(idx);
        grid.appendChild(btn);
      });
    }

    function updateProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById('progressSummary').innerText = `${answeredCount}/${filteredQuestions.length}`;
    }

    function onSearch() {
      searchQuery = document.getElementById('searchInput').value;
      applyFilters();
    }

    function submitExam() {
      clearInterval(timerInterval);
      let correct = 0;
      let wrong = 0;
      filteredQuestions.forEach(q => {
        const userAns = userAnswers[q.id];
        if (userAns === q.answer) {
          correct++;
        } else {
          wrong++;
        }
      });

      const rate = Math.round((correct / filteredQuestions.length) * 100);
      document.getElementById('finalScore').innerText = correct;
      document.getElementById('statCorrect').innerText = correct;
      document.getElementById('statWrong').innerText = wrong;
      document.getElementById('statRate').innerText = rate + '%';

      let praise = "继续加油！";
      if (correct >= 36) praise = "👑 卓越！完美通过选择题单项！";
      else if (correct >= 24) praise = "🎉 及格！基础扎实，冲刺满分！";
      else praise = "⚠️ 基础尚有盲区，建议开启即答即评模式逐题攻克！";
      document.getElementById('scorePraise').innerText = praise;

      document.getElementById('resultModal').classList.add('show');
    }

    function reviewWrong() {
      document.getElementById('resultModal').classList.remove('show');
      setMode('wrong');
    }

    function restartExam() {
      document.getElementById('resultModal').classList.remove('show');
      setMode('exam');
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').innerText = isDark ? '🌓' : '☀️';
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    window.addEventListener('keydown', (e) => {
      if (['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D'].includes(e.key)) {
        if (filteredQuestions && filteredQuestions[currentIndex]) {
          selectOption(filteredQuestions[currentIndex].id, e.key.toUpperCase());
        }
      } else if (e.key === 'ArrowLeft') {
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        nextQuestion();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
